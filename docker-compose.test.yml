services:
  backend-test:
    image: node:20-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run test:ci"
    environment:
      NODE_ENV: test
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      MONGO_DB: ${MONGO_DB}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USERNAME: default
      REDIS_TLS: "false"
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      USER_ANON_SALT: ${USER_ANON_SALT}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      influxdb:
        condition: service_started
    volumes:
      - ./backend:/app
      - backend_nodemodules:/app/node_modules
    networks:
      - bioavanced_net

  frontend-test:
    image: node:20-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run build"
    environment:
      NODE_ENV: test
      VITE_API_BASE_URL: /api
      VITE_PROXY_TARGET: http://backend:3000
    volumes:
      - ./frontend:/app
      - frontend_nodemodules:/app/node_modules
    networks:
      - bioavanced_net

volumes:
  backend_nodemodules:
  frontend_nodemodules:

networks:
  bioavanced_net:
    external: true
    name: bioavanced_net
