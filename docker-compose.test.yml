name: bioavanced-test

x-backend-env: &backend-env
  NODE_ENV: test
  MONGO_URI: mongodb://mongodb-test:27017/bioavanced_test
  MONGO_DB: bioavanced_test
  MONGO_DB_NOVO: bioavanced_test
  NEO4J_URI: bolt://neo4j-test:7687
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: ${TEST_NEO4J_PASSWORD}
  NEO4J_DATABASE: neo4j
  REDIS_URL: redis://redis-test:6379
  INFLUXDB_URL: http://influxdb-test:8086
  INFLUXDB_TOKEN: ${TEST_INFLUXDB_TOKEN}
  INFLUXDB_ORG: bioavanced-test
  INFLUXDB_BUCKET: bioavanced-test
  MQTT_ENABLED: "true"
  MQTT_URL: mqtt://mqtt-test:1883
  MQTT_BROKER_URL: mqtt://mqtt-test:1883
  SMTP_HOST: smtp-test
  SMTP_PORT: "1025"
  JWT_SECRET: ${TEST_JWT_SECRET}
  JWT_REFRESH_SECRET: ${TEST_JWT_REFRESH_SECRET}
  USER_ANON_SALT: ${TEST_USER_ANON_SALT}
  CONSENT_SECRET: ${TEST_CONSENT_SECRET}
  TEST_ADMIN_NAME: ${TEST_ADMIN_NAME}
  TEST_ADMIN_EMAIL: ${TEST_ADMIN_EMAIL}
  TEST_ADMIN_USERNAME: ${TEST_ADMIN_USERNAME}
  TEST_ADMIN_PASSWORD: ${TEST_ADMIN_PASSWORD}
  ALLOW_CLOUD_INTEGRATIONS: "false"
  ALLOWED_ORIGINS: http://frontend-test:5173
  ALLOW_EXTERNAL_TERMINOLOGY_SYNC: "false"
  ALLOW_EXTERNAL_HPO_LOOKUP: "false"
  ALLOW_EXTERNAL_DRUG_LOOKUP: "false"

x-backend-depends: &backend-depends
  mongodb-test:
    condition: service_healthy
  neo4j-test:
    condition: service_healthy
  redis-test:
    condition: service_healthy
  influxdb-test:
    condition: service_healthy
  mqtt-test:
    condition: service_started
  smtp-test:
    condition: service_started

services:
  mongodb-test:
    image: mongo:7
    command: ["mongod", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: [mongodb-test-data:/data/db]
    networks: [bioavanced-test]

  neo4j-test:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${TEST_NEO4J_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
    volumes: [neo4j-test-data:/data]
    networks: [bioavanced-test]

  redis-test:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: [redis-test-data:/data]
    networks: [bioavanced-test]

  influxdb-test:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: bioavanced
      DOCKER_INFLUXDB_INIT_PASSWORD: ${TEST_INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: bioavanced-test
      DOCKER_INFLUXDB_INIT_BUCKET: bioavanced-test
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${TEST_INFLUXDB_TOKEN}
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: [influxdb-test-data:/var/lib/influxdb2]
    networks: [bioavanced-test]

  mqtt-test:
    image: eclipse-mosquitto:2
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    networks: [bioavanced-test]

  smtp-test:
    image: axllent/mailpit:v1.20
    networks: [bioavanced-test]

  backend-test:
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    environment: *backend-env
    command: ["node", "-e", "require('./server').startServer()"]
    depends_on: *backend-depends
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [bioavanced-test]

  worker-test:
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    environment: *backend-env
    command: ["npm", "run", "worker"]
    depends_on: *backend-depends
    networks: [bioavanced-test]

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: http://backend-test:3000/api
      VITE_HMR_HOST: frontend-test
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      backend-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [bioavanced-test]

  playwright-test:
    image: mcr.microsoft.com/playwright:v1.58.2-noble
    working_dir: /workspace/frontend
    volumes:
      - ./:/workspace
    environment:
      CI: "true"
      PLAYWRIGHT_EXTERNAL_STACK: "1"
      PLAYWRIGHT_BASE_URL: http://frontend-test:5173
      TEST_USER: ${TEST_ADMIN_USERNAME}
      TEST_PASS: ${TEST_ADMIN_PASSWORD}
    command: ["npm", "run", "test:e2e"]
    depends_on:
      frontend-test:
        condition: service_healthy
    networks: [bioavanced-test]

networks:
  bioavanced-test:
    driver: bridge

volumes:
  mongodb-test-data:
  neo4j-test-data:
  redis-test-data:
  influxdb-test-data:
