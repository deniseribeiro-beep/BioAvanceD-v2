services:
  backend-test:
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    container_name: bioavanced-backend-test
    command: npx vitest run
    env_file:
      - .env.docker
    environment:
      NODE_ENV: test
    volumes:
      - ./api/backend:/app
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  # Runs the real Playwright e2e suite (root tests/e2e/) against the live
  # backend+frontend containers over the compose network, instead of mocking
  # the backend out like a plain `npm run dev` based run would.
  frontend-test:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    container_name: bioavanced-frontend-test
    working_dir: /app
    command: sh -c "npm install && npx playwright test"
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend:5173
      PLAYWRIGHT_API_BASE_URL: http://backend:3000
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
      CI: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
