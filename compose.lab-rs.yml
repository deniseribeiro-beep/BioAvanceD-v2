# Lab overlay: single-node Mongo replica set with keyFile (auth + replSet).
services:
  mongodb:
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo-keyfile"]
    volumes:
      - ./infra/mongo/lab-keyfile:/etc/mongo-keyfile:ro

  mongo-rs-init-lab:
    image: mongo:7.0.45
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        for i in $$(seq 1 40); do
          if mongosh --host mongodb -u "$$MONGO_ROOT_USERNAME" -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval '
            try {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] });
            } catch (e) {
              if (!/already initialized/.test(e.message)) { throw e; }
            }
            const h = db.hello();
            if (h.setName === "rs0") { print("RS_OK"); quit(0); }
            quit(2);
          '; then
            exit 0
          fi
          sleep 3
        done
        echo "RS_INIT_FAILED" >&2
        exit 1
    restart: "no"
