name: bioavanced

services:
  mongo-keyfile-init:
    image: mongo:7
    user: "0:0"
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -eu
        if [ ! -s /mongo-keyfile/keyfile ]; then
          openssl rand -base64 756 > /mongo-keyfile/keyfile
        fi
        chown 999:999 /mongo-keyfile/keyfile
        chmod 400 /mongo-keyfile/keyfile
    volumes:
      - mongodb_keyfile:/mongo-keyfile

  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/run/mongodb-keyfile/keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_keyfile:/run/mongodb-keyfile:ro
    depends_on:
      mongo-keyfile-init:
        condition: service_completed_successfully
    # #923: healthy now means transaction-ready, not merely TCP/ping-ready.
    # The separate mongo-rs-init service below starts from service_started,
    # initiates rs0, and this check only flips green after this node is PRIMARY.
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username '$${MONGO_INITDB_ROOT_USERNAME}' --password '$${MONGO_INITDB_ROOT_PASSWORD}' --authenticationDatabase admin --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mongo-rs-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongodb:
        condition: service_started
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -eu
        for i in $$(seq 1 60); do
          if mongosh --host mongodb --quiet \
            --username "$$MONGO_ROOT_USERNAME" \
            --password "$$MONGO_ROOT_PASSWORD" \
            --authenticationDatabase admin --eval '
              try {
                rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] });
              } catch (e) {
                if (!/already initialized/.test(e.message)) { throw e; }
              }
              quit(db.hello().isWritablePrimary ? 0 : 1);
            '; then
            exit 0
          fi
          sleep 2
        done
        echo "MongoDB replica set rs0 did not become PRIMARY" >&2
        exit 1

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USERNAME}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  tsa:
    build:
      context: ./infra/tsa
      dockerfile: Dockerfile
    init: true
    environment:
      PORT: "8095"
      TSA_CONFIG: /etc/tsa/openssl-ts.cnf
      TSA_SECTION: tsa_config
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8095/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  witness:
    build:
      context: ./infra/witness
      dockerfile: Dockerfile
    init: true
    environment:
      PORT: "8096"
      WITNESS_ID: bioavanced-local-witness
      WITNESS_PRIVATE_KEY_PEM_FILE: /run/secrets/witness_key.pem
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8096/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mongodb_keyfile:
