services:
  nginx:
    image: jc21/nginx-proxy-manager:latest
    container_name: bioavanced-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
      - ./infra/nginx/npm/custom:/data/nginx/custom
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - bioavanced_net

  mongodb:
    image: mongo:7
    container_name: bioavanced-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--username", "${MONGO_ROOT_USERNAME}", "--password", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - bioavanced_net

  redis:
    image: redis:7-alpine
    container_name: bioavanced-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks:
      - bioavanced_net

  neo4j:
    image: neo4j:5-community
    container_name: bioavanced-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u \"$NEO4J_USERNAME\" -p \"$NEO4J_PASSWORD\" \"RETURN 1\" >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - bioavanced_net

  influxdb:
    image: influxdb:2.7
    container_name: bioavanced-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    ports:
      - "${INFLUXDB_PORT}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "-host", "http://localhost:8086"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - bioavanced_net

  backend:
    build:
      context: ./backend
    container_name: bioavanced-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      influxdb:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000

      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      MONGO_DB: ${MONGO_DB}
      MONGO_DB_NOVO: ${MONGO_DB_NOVO}

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: ${NEO4J_DATABASE}
      NEO4J_REQUIRED: ${NEO4J_REQUIRED}

      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}

      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      USER_ANON_SALT: ${USER_ANON_SALT}

      FRONTEND_URL: http://frontend
      API_URL: http://backend:3000
      ALLOWED_ORIGINS: http://frontend,http://nginx,http://localhost:8080,http://127.0.0.1:8080
      CORS_ALLOW_ALL: "false"
      TRUST_PROXY: "1"

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USERNAME: default
      REDIS_TLS: "false"

      LINEAGE_MODE: ${LINEAGE_MODE}
      FHIR_READ_MODE: ${FHIR_READ_MODE}
      BACKUP_DIR: ${BACKUP_DIR:-/app/backups}

      APP_DOMAIN: ${APP_DOMAIN:-https://bioadvanced.dev}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-BioAvanceD <no-reply@bioadvanced.dev>}
      TELEMETRY_MIN_TEMP_ALERT: ${TELEMETRY_MIN_TEMP_ALERT:-196}
      TELEMETRY_MAX_TEMP_ALERT: ${TELEMETRY_MAX_TEMP_ALERT:-80}
    ports:
      - "${BACKEND_PORT}:3000"
    volumes:
      - backend_backups:${BACKUP_DIR:-/app/backups}
    networks:
      bioavanced_net:
        aliases:
          - backend

  worker:
    build:
      context: ./backend
    container_name: bioavanced-worker
    restart: unless-stopped
    command: ["node", "./src/workers/worker.js"]
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production

      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      MONGO_DB: ${MONGO_DB}
      MONGO_DB_NOVO: ${MONGO_DB_NOVO}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USERNAME: default
      REDIS_TLS: "false"

      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      USER_ANON_SALT: ${USER_ANON_SALT}
    networks:
      - bioavanced_net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: bioavanced-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - bioavanced_net

volumes:
  mongo_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  influxdb_data:
  influxdb_config:
  backend_backups:

networks:
  bioavanced_net:
    name: bioavanced_net
    driver: bridge
