name: Publish images

# #1563: builds the backend, worker and frontend images that compose.prod.yml
# and compose.test.yml build, and pushes them to GHCR tagged with the full
# commit SHA, so a deploy or showcase run pulls them instead of rebuilding:
#
#   ghcr.io/deniseribeiro-beep/bioavanced-backend:<sha>        api/backend/Dockerfile.prod
#   ghcr.io/deniseribeiro-beep/bioavanced-frontend:<sha>       frontend/Dockerfile.prod
#   ghcr.io/deniseribeiro-beep/bioavanced-backend-test:<sha>   api/backend/Dockerfile.dev
#   ghcr.io/deniseribeiro-beep/bioavanced-frontend-test:<sha>  frontend/Dockerfile.prod, target preview
#
# <sha> is the 40-character commit SHA the run was triggered for. The worker
# services run the backend image with another command, so they have no image
# of their own. compose.prod.images.yml and compose.test.images.yml point the
# compose services at these images through IMAGE_TAG. Each matrix entry below
# repeats its compose service's build: section, and must change with it.
#
# ci-pipeline.yml calls this workflow once every other CI job is green, on a
# push to the integration branch only. It authenticates with the run's own
# GITHUB_TOKEN; no other secret is read.

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # compose.prod.yml: backend, worker, neo4j-projection-worker,
          # foundation, essential-references
          - image: bioavanced-backend
            context: api/backend
            file: api/backend/Dockerfile.prod
            target: ""
            build-args: ""
          # compose.prod.yml: frontend (the final runtime stage)
          - image: bioavanced-frontend
            context: frontend
            file: frontend/Dockerfile.prod
            target: ""
            build-args: ""
          # compose.test.yml: backend-app-test, worker-test and every other
          # service built from api/backend/Dockerfile.dev
          - image: bioavanced-backend-test
            context: api/backend
            file: api/backend/Dockerfile.dev
            target: ""
            build-args: ""
          # compose.test.yml: frontend-app-test
          - image: bioavanced-frontend-test
            context: frontend
            file: frontend/Dockerfile.prod
            target: preview
            build-args: |
              VITE_API_BASE_URL=http://localhost:3000/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One plain image manifest per tag: provenance and SBOM attestations
      # would add untagged versions that the retention step below counts.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/deniseribeiro-beep/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # The packages are private, so every stored version counts toward the
      # account's package storage: keep the newest few SHAs only.
      - name: Prune old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 5
