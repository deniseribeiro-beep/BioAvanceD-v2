name: Storage v2 canonical placement migration

on:
  push:
    branches:
      - stabilize/v2.0.0-prototype

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stabilize/v2.0.0-prototype
          fetch-depth: 0
      - name: Apply canonical placement migration
        run: python3 scripts/maintenance/storage_v2_return_migration.py
      - name: Commit migration
        run: |
          git config user.name "BioAvanceD CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor(v2): return canonical auto-allocation placement"
          git push origin HEAD:stabilize/v2.0.0-prototype
