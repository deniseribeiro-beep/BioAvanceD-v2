name: BioAvanceD release manifest integrity

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - stabilize/v2.0.0-prototype

  pull_request:
    branches:
      - main
      - stabilize/v2.0.0-prototype

permissions:
  contents: read

concurrency:
  group: bioavanced-release-manifest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release-manifest:
    name: Verify approved release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify RELEASE_MANIFEST against committed bytes
        run: node scripts/verify-release-manifest.js
