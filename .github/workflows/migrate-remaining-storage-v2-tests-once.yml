name: Remaining storage v2 test migration

on:
  push:
    branches:
      - stabilize/v2.0.0-prototype

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stabilize/v2.0.0-prototype
          fetch-depth: 0
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/backend/package-lock.json
      - name: Migrate remaining storage tests
        run: |
          python3 scripts/maintenance/migrate_remaining_storage_v2_tests_v2.py
          python3 scripts/maintenance/fix_intake_v2_test_harness.py
      - name: Install backend dependencies
        run: |
          npm --prefix api/backend ci
          npm --prefix api/backend install --no-save @rollup/rollup-linux-x64-gnu
      - name: Run targeted storage-adjacent tests
        run: npm --prefix api/backend exec -- vitest run tests/unit/intakeWizard.routes.test.js tests/unit/import-lgpd.service.importSamples.unit.test.js
      - name: Commit migration
        run: |
          git config user.name "BioAvanceD CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test(v2): migrate remaining canonical storage coverage"
          git push origin HEAD:stabilize/v2.0.0-prototype
