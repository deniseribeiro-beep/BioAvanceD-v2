name: "Wave 2 remove lineage compatibility adapter"

on:
  push:
    branches:
      - stabilize/v2.0.0-prototype
    paths:
      - .github/workflows/wave2-remove-lineage-adapter.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/v2.0.0-prototype
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Remove final compatibility adapter consumers
        run: python3 scripts/wave2-remove-lineage-adapter.py
      - name: Install backend dependencies
        working-directory: api/backend
        run: npm ci
      - name: Validate architecture
        working-directory: api/backend
        run: npm run test:architecture
      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix(wave2): remove legacy lineage compatibility adapter (#1132)"
          git push origin HEAD:stabilize/v2.0.0-prototype
