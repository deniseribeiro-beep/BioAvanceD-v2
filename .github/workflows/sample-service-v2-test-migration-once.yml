name: Sample service v2 test migration

on:
  push:
    branches:
      - stabilize/v2.0.0-prototype

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: stabilize/v2.0.0-prototype
          fetch-depth: 0
      - name: Migrate sample service tests
        run: python3 scripts/maintenance/sample_service_v2_test_migration.py
      - name: Commit migration
        run: |
          git config user.name "BioAvanceD CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "test(v2): migrate sample service canonical placement coverage"
          git push origin HEAD:stabilize/v2.0.0-prototype
