name: BioAvanceD current-state validation

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bioavanced-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-state-validation:
    name: Current-state validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            api/backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix api/backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Validate Git diff
        run: git diff --check

      # #960: there is no separate "Backend typecheck" step because there is
      # no backend typecheck. api/backend is plain JavaScript and
      # scripts/lint.js is a `node --check` syntax pass over src/ and
      # scripts/; the package.json `typecheck` alias that used to back a
      # second step here ran that identical command.
      - name: Backend lint
        run: npm --prefix api/backend run lint

      - name: Backend architecture tests
        run: npm --prefix api/backend run test:architecture

      - name: Essential reference seed validation
        run: |
          npm --prefix api/backend run seed:validate:essential
          npm --prefix api/backend run seed:essential:dry-run

      # #960: and no "Frontend lint" step, because there is no linter. There
      # is no eslint config or dependency anywhere in this repo -- the
      # frontend `lint` alias that used to back a step here ran
      # `tsc --noEmit`, the identical command as the typecheck below.
      - name: Frontend typecheck
        run: npm --prefix frontend run typecheck

      - name: Frontend build
        run: npm --prefix frontend run build

      - name: Validate Compose configuration
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            config --quiet

      - name: Remove previous validation stack
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            down --volumes --remove-orphans

      - name: Build validation stack
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            build --no-cache

      - name: Start application stack
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            up -d --wait \
            mongodb-test \
            neo4j-test \
            redis-test \
            mqtt-test \
            influxdb-test \
            smtp-test \
            tsa-test \
            witness-test \
            backend-app-test \
            worker-test \
            frontend-app-test

      - name: Display service status
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            ps

      - name: Verify empty MongoDB application collections
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            exec -T mongodb-test \
            mongosh --quiet bioavanced_test --eval '
              const collections = [
                "users",
                "patients",
                "samples",
                "consents",
                "medication_dictionary",
                "orphanet_diseases",
                "terminologies",
                "hpo_terms",
                "biomarker_observations",
                "sensors",
                "equipment",
                "locations",
                "reports"
              ];

              let total = 0;

              for (const name of collections) {
                const count = db.getCollection(name).countDocuments({});
                print(name + ": " + count);
                total += count;
              }

              if (total !== 0) {
                print("Application collections are not empty.");
                quit(1);
              }

              print("All application collections are empty.");
            '

      - name: Verify empty Neo4j graph
        run: |
          NODE_COUNT="$(
            docker compose \
              --env-file .env.test.example \
              -f compose.test.yml \
              exec -T neo4j-test \
              cypher-shell \
                -u neo4j \
                -p testpassword \
                --format plain \
                "MATCH (n) RETURN count(n) AS count;" \
              | tail -n 1 \
              | tr -d '\r'
          )"

          echo "Neo4j node count: ${NODE_COUNT}"
          test "${NODE_COUNT}" = "0"

      - name: Run backend test suite
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            run --rm --no-deps backend-unit-runner

      - name: Collect Compose logs on failure
        if: failure()
        continue-on-error: true
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            logs --no-color > compose-test.log

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bioavanced-validation-failure
          path: compose-test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove containers and isolated volumes
        if: always()
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            down --volumes --remove-orphans

  # #1324: RNF017 criterion 1 asks CI to run the unit tests; the frontend's
  # vitest suite (`test:unit`, src/** and tests/unit/**) ran nowhere in CI.
  frontend-unit-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run frontend unit tests
        run: npm --prefix frontend run test:unit

  # #1324: RNF017 criterion 1 also asks for security tests; this job audits
  # both lockfiles for known advisories. `npm audit` reads the lockfile
  # alone, so no install step is needed.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            api/backend/package-lock.json
            frontend/package-lock.json

      - name: Audit frontend dependencies
        run: npm --prefix frontend audit --audit-level=critical

      - name: Audit backend dependencies
        run: npm --prefix api/backend audit --audit-level=critical
