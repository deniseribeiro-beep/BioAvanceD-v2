name: BioAvanceD current-state validation

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - stabilize/v2.0.0-prototype

  pull_request:
    branches:
      - main
      - stabilize/v2.0.0-prototype

permissions:
  contents: read

concurrency:
  group: bioavanced-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-state-validation:
    name: Current-state validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            api/backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix api/backend ci

      - name: Install frontend dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix frontend install --no-save @rollup/rollup-linux-x64-gnu

      - name: Validate Git diff
        run: git diff --check

      - name: Canonical v2 dictionary gate
        run: npm --prefix api/backend run dictionary:validate

      - name: Backend lint
        run: npm --prefix api/backend run lint

      - name: Backend architecture tests
        run: npm --prefix api/backend run test:architecture

      - name: Essential reference seed validation
        run: |
          npm --prefix api/backend run seed:validate:essential
          npm --prefix api/backend run seed:essential:dry-run

      - name: Frontend typecheck
        run: npm --prefix frontend run typecheck

      - name: Frontend build
        run: npm --prefix frontend run build

      - name: Validate effective Compose configuration and RF022 precedence
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            -f compose.test.foundation.yml \
            config --quiet

          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            -f compose.test.foundation.yml \
            config --format json > /tmp/bioavanced-compose-effective.json

          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('/tmp/bioavanced-compose-effective.json', 'utf8'));
          const services = cfg.services || {};
          const foundation = services['foundation-bootstrap-test'];
          if (!foundation) throw new Error('foundation-bootstrap-test ausente do Compose efetivo');
          const foundationDeps = foundation.depends_on || {};
          if (foundationDeps['backend-app-test']) {
            throw new Error('RF022 violado: Foundation ainda depende da API');
          }
          for (const required of ['mongodb-test', 'mongo-rs-init-test', 'neo4j-test', 'redis-test', 'influxdb-test']) {
            if (!foundationDeps[required]) throw new Error(`RF022: Foundation sem dependência de ${required}`);
          }
          for (const dependent of ['backend-app-test', 'worker-test', 'neo4j-projection-worker-test']) {
            const dep = services[dependent]?.depends_on?.['foundation-bootstrap-test'];
            if (!dep || dep.condition !== 'service_completed_successfully') {
              throw new Error(`RF022: ${dependent} não está bloqueado por Foundation concluído`);
            }
          }
          console.log('RF022 Compose precedence verified in effective configuration.');
          NODE

      - name: Remove previous validation stack
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            -f compose.test.foundation.yml \
            down --volumes --remove-orphans

      - name: Build validation stack
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            -f compose.test.foundation.yml \
            build --no-cache

      - name: Start Foundation infrastructure
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            -f compose.test.foundation.yml \
            up -d --wait \
            mongodb-test \
            neo4j-test \
            redis-test \
            mqtt-test \
            influxdb-test \
            smtp-test \
            tsa-test \
            witness-test

      - name: Initialize MongoDB replica set
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            -f compose.test.foundation.yml \
            up --no-deps --abort-on-container-exit --exit-code-from mongo-rs-init-test mongo-rs-init-test

      - name: Run Foundation one-shot before application
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            -f compose.test.foundation.yml \
            up --no-deps --abort-on-container-exit --exit-code-from foundation-bootstrap-test foundation-bootstrap-test

      - name: Verify Foundation execution evidence
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            -f compose.test.foundation.yml \
            exec -T mongodb-test \
            mongosh --quiet bioavanced_test --eval '
              const runs = db.getCollection("foundationDataRuns").find({}).sort({ startedAt: -1 }).limit(1).toArray();
              if (runs.length !== 1) {
                print("FoundationDataRun evidence missing.");
                quit(1);
              }
              const run = runs[0];
              const completeness = run.validationSummary && run.validationSummary.dictionaryCompleteness;
              printjson({
                foundationDataRunId: run.foundationDataRunId,
                runStatus: run.runStatus,
                dictionaryVersion: run.dictionaryVersion,
                dictionaryChecksum: run.dictionaryChecksum,
                completeness
              });
              if (run.runStatus !== "completed") quit(1);
              if (run.dictionaryVersion !== "2.0.0") quit(1);
              if (!completeness || completeness.verified !== true) quit(1);
              if (completeness.expectedTotal !== 1644 || completeness.loadedTotal !== 1644) quit(1);
              if (completeness.historicalTotal !== 929) quit(1);
            '

      - name: Verify Foundation creates no operational domain records
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            -f compose.test.foundation.yml \
            exec -T mongodb-test \
            mongosh --quiet bioavanced_test --eval '
              const collections = [
                "users",
                "patients",
                "samples",
                "patientConsents",
                "consents",
                "biomarker_observations",
                "sensors",
                "equipment",
                "locations",
                "reports"
              ];

              let total = 0;
              for (const name of collections) {
                const count = db.getCollection(name).countDocuments({});
                print(name + ": " + count);
                total += count;
              }
              if (total !== 0) {
                print("Foundation criou registros operacionais de domínio indevidos.");
                quit(1);
              }
              print("Foundation post-condition verified: no operational domain records.");
            '

      - name: Verify empty Neo4j graph after Foundation
        run: |
          NODE_COUNT="$(
            docker compose \
              --env-file .env.test.example \
              -f compose.test.yml \
              -f compose.test.foundation.yml \
              exec -T neo4j-test \
              cypher-shell \
                -u neo4j \
                -p testpassword \
                --format plain \
                "MATCH (n) RETURN count(n) AS count;" \
              | tail -n 1 \
              | tr -d '\r'
          )"
          echo "Neo4j node count after Foundation: ${NODE_COUNT}"
          test "${NODE_COUNT}" = "0"

      - name: Start application only after Foundation
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            -f compose.test.foundation.yml \
            up -d --wait \
            backend-app-test \
            worker-test \
            neo4j-projection-worker-test \
            frontend-app-test

      - name: Prove runtime Foundation precedence
        run: |
          FOUNDATION_FINISHED="$(docker inspect -f '{{.State.FinishedAt}}' bioavanced-test-foundation-bootstrap-test-1)"
          BACKEND_STARTED="$(docker inspect -f '{{.State.StartedAt}}' bioavanced-test-backend-app-test-1)"
          echo "Foundation finished: ${FOUNDATION_FINISHED}"
          echo "Backend started:      ${BACKEND_STARTED}"
          node -e 'const f=Date.parse(process.argv[1]);const b=Date.parse(process.argv[2]);if(!Number.isFinite(f)||!Number.isFinite(b)||f>b){process.exit(1)}' "${FOUNDATION_FINISHED}" "${BACKEND_STARTED}"

      - name: Display service status
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            -f compose.test.foundation.yml \
            ps -a

      - name: Run backend test suite
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            -f compose.test.foundation.yml \
            run --rm --no-deps backend-unit-runner

      - name: Collect Compose logs on failure
        if: failure()
        continue-on-error: true
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            -f compose.test.foundation.yml \
            logs --no-color > compose-test.log

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bioavanced-validation-failure
          path: compose-test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove containers and isolated volumes
        if: always()
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            -f compose.test.foundation.yml \
            down --volumes --remove-orphans
