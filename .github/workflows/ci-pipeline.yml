name: BioAvanceD CI/CD Pipeline

# Dispara os testes sempre que houver um push ou pull request na branch 'main'
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  testes-automatizados:
    # Levanta uma máquina virtual Linux novinha na nuvem do GitHub
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        image: neo4j:5-community
        ports:
          - 7474:7474
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/testpassword
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
      influxdb:
        image: influxdb:2.7
        ports:
          - 8086:8086
        env:
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: bioavanced
          DOCKER_INFLUXDB_INIT_PASSWORD: bioavanced-test-password
          DOCKER_INFLUXDB_INIT_ORG: bioavanced-test
          DOCKER_INFLUXDB_INIT_BUCKET: bioavanced-test-bucket
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: bioavanced-test-token
        options: >-
          --health-cmd "influx ping --host http://localhost:8086"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/bioavanced_test
      MONGO_DB: bioavanced_test
      MONGO_DB_NOVO: bioavanced_test
      JWT_SECRET: vitest-secret-key
      JWT_REFRESH_SECRET: vitest-refresh-secret-key
      ENCRYPTION_KEY: vitest-encryption-key-32-characters
      ENCRYPTION_KEY_ID: test-key-1
      USER_ANON_SALT: vitest-user-anon-salt
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: testpassword
      NEO4J_DATABASE: neo4j
      NEO4J_REQUIRED: "false"
      LINEAGE_MODE: fail-open
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      INFLUXDB_URL: http://127.0.0.1:8086
      INFLUXDB_TOKEN: bioavanced-test-token
      INFLUXDB_ORG: bioavanced-test
      INFLUXDB_BUCKET: bioavanced-test-bucket
      ALLOW_CLOUD_INTEGRATIONS: "false"
      ALLOW_EXTERNAL_TERMINOLOGY_SYNC: "false"
      ALLOW_EXTERNAL_HPO_LOOKUP: "false"
      ALLOW_EXTERNAL_DRUG_LOOKUP: "false"
      MQTT_ENABLED: "false"
      RESEND_API_KEY: re_test_dummy_key
      EMAIL_FROM: BioAvanceD Test <noreply@example.test>
      ALERT_EMAIL_TO: alerts@example.test

    steps:
      # 1. Copia o seu código do repositório para a máquina virtual
      - name: 📥 Baixar o código (Checkout)
        uses: actions/checkout@v4

      # 2. Instala o Node.js
      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Substitua pela versão do Node que você usa

      # 3. Testa o Backend (Isolado)
      - name: 📦 Instalar dependências do Backend
        run: |
          cd api/backend
          npm ci # ou yarn install / pnpm install

      - name: 🧪 Rodar Testes de Backend (Vitest)
        run: |
          cd api/backend
          npx vitest run

      # 4. Testa o Frontend (Isolado)
      - name: 📦 Instalar dependências do Frontend
        run: |
          cd frontend
          npm ci # ou yarn install / pnpm install

      - name: 🌐 Instalar Navegadores do Playwright
        run: |
          cd frontend
          npx playwright install --with-deps

      - name: 🎭 Rodar Testes E2E (Playwright)
        run: |
          cd frontend
          npx playwright test

      # 5. Salva o relatório do Playwright caso o teste falhe
      - name: 📊 Salvar Relatório de Erros do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
