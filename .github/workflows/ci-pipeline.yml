name: BioAvanceD CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - audit/intake-governance-i18n-orpha
  pull_request:
    branches:
      - main

jobs:
  validation-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hygiene gates
        run: |
          git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- ':!academico/inpi/**'
          node scripts/audit-zero-mocks.js

      - name: Validate compose file
        run: npm run test:stack:config

      - name: Build validation stack
        run: npm run test:stack:build

      - name: Start validation stack
        run: npm run test:stack:up

      - name: Backend coverage
        run: npm run docker:test:backend

      - name: Frontend coverage
        run: npm --prefix frontend run test:unit:coverage

      - name: Run Playwright E2E
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: npm run docker:test:frontend

      - name: Tear down validation stack
        if: always()
        run: npm run test:stack:down
