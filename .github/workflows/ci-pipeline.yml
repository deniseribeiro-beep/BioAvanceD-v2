name: BioAvanceD current-state validation

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - feature/docker-e2e-backend-integration

  pull_request:
    branches:
      - main
      - feature/docker-e2e-backend-integration

permissions:
  contents: read

concurrency:
  group: bioavanced-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-state-validation:
    name: Current-state validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            api/backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix api/backend ci

      - name: Install frontend dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix frontend install --no-save @rollup/rollup-linux-x64-gnu

      - name: Validate Git diff
        run: git diff --check

      # #960: there is no separate "Backend typecheck" step because there is
      # no backend typecheck. api/backend is plain JavaScript and
      # scripts/lint.js is a `node --check` syntax pass over src/ and
      # scripts/; the package.json `typecheck` alias that used to back a
      # second step here ran that identical command.
      - name: Backend lint
        run: npm --prefix api/backend run lint

      - name: Backend architecture tests
        run: npm --prefix api/backend run test:architecture

      - name: Essential reference seed validation
        run: npm --prefix api/backend run seed:validate:essential

      # #960: and no "Frontend lint" step, because there is no linter. There
      # is no eslint config or dependency anywhere in this repo -- the
      # frontend `lint` alias that used to back a step here ran
      # `tsc --noEmit`, the identical command as the typecheck below.
      - name: Frontend typecheck
        run: npm --prefix frontend run typecheck

      - name: Frontend build
        run: npm --prefix frontend run build

      - name: Validate Compose configuration
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            config --quiet

      - name: Remove previous validation stack
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            down --volumes --remove-orphans

      # Large compose.test image matrix exhausted the ubuntu-latest disk
      # (~83 MB left) during layer export. Free runner bulk and avoid a
      # forced no-cache rebuild that duplicates every intermediate layer.
      - name: Free runner disk before image build
        run: |
          df -h
          docker system prune -af --volumes || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Build validation stack
        env:
          COMPOSE_PARALLEL_LIMIT: "2"
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            build

      - name: Start application stack
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            up -d --wait \
            mongodb-test \
            neo4j-test \
            redis-test \
            mqtt-test \
            influxdb-test \
            smtp-test \
            tsa-test \
            witness-test \
            backend-app-test \
            worker-test \
            frontend-app-test

      - name: Display service status
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            ps

      # #1413: the essential reference load that backend-app-test waits for
      # (essential-reference-bootstrap-test, RF022 AC7 Phase 2) writes the
      # SPREC minimal set into terminologies by design. Only a terminology
      # outside that set counts as application data.
      - name: Verify empty MongoDB application collections
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            exec -T mongodb-test \
            mongosh --quiet bioavanced_test --eval '
              const collections = [
                "users",
                "patients",
                "samples",
                "consents",
                "medication_dictionary",
                "orphanet_diseases",
                "hpo_terms",
                "biomarker_observations",
                "sensors",
                "equipment",
                "locations",
                "reports"
              ];

              let total = 0;

              for (const name of collections) {
                const count = db.getCollection(name).countDocuments({});
                print(name + ": " + count);
                total += count;
              }

              const essentialTerminology = { sistema: "SPREC", fonte: "seed-essential-sprec-v1" };
              const terminologies = db.getCollection("terminologies");
              const otherTerminologies = terminologies.countDocuments({ $nor: [essentialTerminology] });
              print("terminologies: " + otherTerminologies + " (essential SPREC set: " + terminologies.countDocuments(essentialTerminology) + ")");
              total += otherTerminologies;

              if (total !== 0) {
                print("Application collections are not empty.");
                quit(1);
              }

              print("All application collections are empty.");
            '

      - name: Verify empty Neo4j graph
        run: |
          NODE_COUNT="$(
            docker compose \
              --env-file .env.test.example \
              -f compose.test.yml \
              exec -T neo4j-test \
              cypher-shell \
                -u neo4j \
                -p testpassword \
                --format plain \
                "MATCH (n) RETURN count(n) AS count;" \
              | tail -n 1 \
              | tr -d '\r'
          )"

          echo "Neo4j node count: ${NODE_COUNT}"
          test "${NODE_COUNT}" = "0"

      # #1413: the dry run records a FoundationDataRun (RF022), so it needs
      # the stack's MongoDB and runs here, not before the stack exists.
      - name: Essential reference seed dry run
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            run --rm --no-deps foundation-bootstrap-test \
            npm run seed:essential:dry-run

      - name: Run backend test suite
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            run --rm --no-deps backend-unit-runner

      - name: Collect Compose logs on failure
        if: failure()
        continue-on-error: true
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            logs --no-color > compose-test.log

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bioavanced-validation-failure
          path: compose-test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove containers and isolated volumes
        if: always()
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            down --volumes --remove-orphans

  # #1324: RNF017 criterion 1 asks CI to run the unit tests; the frontend's
  # vitest suite (`test:unit`, src/** and tests/unit/**) ran nowhere in CI.
  # #1475: it runs `test:coverage`, so the 90% thresholds in
  # frontend/vitest.config.js are enforced here, as the backend job's are.
  frontend-unit-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run frontend unit tests with coverage
        run: npm --prefix frontend run test:coverage

  # #1454: the backend vitest suite and its 90% coverage floor
  # (api/backend/vitest.config.js) ran nowhere in CI. backend-unit-runner
  # runs current-state:ci, which has no vitest run, and its image leaves
  # tests/unit and tests/integration out (#947). The suite mocks its
  # databases in tests/vitest.setup.js, so it runs natively, like the
  # frontend unit job, with no compose stack.
  backend-unit-tests:
    name: Backend unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix api/backend ci

      - name: Run backend unit tests with coverage
        run: npm --prefix api/backend run test:coverage

  # #1324: RNF017 criterion 1 also asks for security tests; this job audits
  # both lockfiles for known advisories. `npm audit` reads the lockfile
  # alone, so no install step is needed.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            api/backend/package-lock.json
            frontend/package-lock.json

      - name: Audit frontend dependencies
        run: npm --prefix frontend audit --audit-level=high

      - name: Audit backend dependencies
        run: npm --prefix api/backend audit --audit-level=high

  # #284: no job ran Playwright; this one runs the in-container e2e gate the
  # way it runs locally, on push/PR to main and to the integration branch
  # (#599). The job's exit is the gate's: 3 build, 4 stack up, 5 one-shot,
  # 6 projection worker, 7 the projection worker did not stop or restart,
  # 8 the stopped-worker phase failed (its log in e2e-worker-stopped.txt),
  # 9 the main run never started, 10 the RNF001 UI p95 breached or did not
  # run, or a download or import measurement failed (#1469), otherwise the
  # runner's own code (#1503).
  e2e-tests:
    name: E2E tests (in-container Playwright)
    runs-on: ubuntu-latest
    needs: current-state-validation
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove previous e2e stack
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            down --volumes --remove-orphans

      # Same prune as current-state-validation: e2e-gate rebuilds the full
      # compose.test matrix on a fresh runner and exhausts disk without this.
      - name: Free runner disk before e2e gate
        run: |
          df -h
          docker system prune -af --volumes || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Run the e2e gate
        env:
          COMPOSE_PARALLEL_LIMIT: "2"
        run: bash scripts/e2e-gate.sh e2e-gate-out

      - name: Print the RNF001 UI p95 summary
        if: always()
        run: |
          test -f e2e-gate-out/rnf001-ui-p95.json || exit 0
          node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));for(const[p,r]of Object.entries(x.routes||{}))console.log((r.pass===true?"PASS ":"BREACH ")+p+" p95Ms="+r.p95+(r.skipped?" skipped="+r.reason:""));for(const[n,m]of Object.entries(x.separatelyMeasured||{}))console.log(m.measured===true?"MEASURED "+n+" p95Ms="+m.p95+" bytes="+m.bytes:"NOT-MEASURED "+n);console.log("overallPass="+x.overallPass)' e2e-gate-out/rnf001-ui-p95.json

      - name: Print the RNF001 external-service outage summary
        if: always()
        run: |
          test -f e2e-gate-out/rnf001-outage.json || exit 0
          node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log((x.measured===true?"MEASURED ":"NOT-MEASURED ")+"external-service-unavailable service="+x.service+" route="+x.route+" serviceDown="+x.serviceDown+" p95Ms="+x.p95+" statuses="+(x.statuses||[]).join(",")+(x.reason?" reason="+x.reason:""));console.log("overallPass="+x.overallPass)' e2e-gate-out/rnf001-outage.json

      - name: Collect Compose logs on failure
        if: failure()
        continue-on-error: true
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            logs --no-color > e2e-gate-out/compose-test.log

      - name: Upload e2e gate output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bioavanced-e2e-gate
          path: e2e-gate-out/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove containers and isolated volumes
        if: always()
        run: |
          docker compose \
            --env-file .env.test.example \
            -f compose.test.yml \
            down --volumes --remove-orphans

  # #1469 (RNF002 C1, C3, C4): the identifier lookups' p95 against the 3 s
  # budget, on 100,000 seeded records per lookup collection, with the
  # explain plan, the indexes and the load profile recorded. The script
  # exits 1 when a lookup is unindexed, misses its index or is over budget,
  # so a breach fails this job. A fresh MongoDB service, no compose stack.
  identifier-lookup-budget:
    name: Identifier lookup budget (RNF002)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:7.0.45
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix api/backend ci

      - name: Seed 100,000 records and check the lookup budget
        working-directory: api/backend
        env:
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB: bioavanced_rnf002
          MONGO_DB_NOVO: bioavanced_rnf002
        run: |
          mkdir -p ../rnf002-out
          node scripts/identifier-lookup-explain.js --seed 100000 --out ../rnf002-out/identifier-lookup.json

      - name: Print the lookup summary
        if: always()
        run: |
          test -f rnf002-out/identifier-lookup.json || exit 0
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));for(const l of r.lookups)console.log((l.withinBudget===true&&l.indexed===true&&l.indexName===l.expectedIndex?"PASS ":"BREACH ")+l.id+" p95Ms="+l.p95Ms+" index="+l.indexName)' rnf002-out/identifier-lookup.json

      - name: Upload the lookup record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rnf002-identifier-lookup
          path: rnf002-out/
          if-no-files-found: ignore
          retention-days: 7
