name: BioAvanceD real-services validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  real-services:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_FILE: docker-compose.test.yml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            api/backend/package-lock.json
            frontend/package-lock.json

      - name: Prepare isolated test environment
        run: cp .env.test.example .env.test

      - name: Enforce zero-mock policy
        run: npm run audit:zero-mocks

      - name: Validate and build real-service stack
        run: |
          npm run test:stack:config
          npm run test:stack:build

      - name: Start stack and wait for health checks
        run: npm run test:stack:up

      - name: Reset databases and load deterministic seeds
        run: |
          npm run test:stack:reset
          npm run test:stack:seed

      - name: Run backend integration suite
        run: npm run test:stack:backend

      - name: Run Playwright against real services
        run: npm run test:stack:e2e

      - name: Run full system audit
        run: npm run audit:full

      - name: Collect failure evidence
        if: failure()
        run: docker compose --env-file .env.test -f docker-compose.test.yml logs --no-color > test-stack.log

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-services-failure-evidence
          path: |
            test-stack.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove synthetic data
        if: always()
        run: npm run test:stack:cleanup

      - name: Remove containers and isolated volumes
        if: always()
        run: npm run test:stack:down
