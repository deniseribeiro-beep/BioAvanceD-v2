name: Item 7 canonical v2 reconciliation

on:
  push:
    branches:
      - stabilize/v2.0.0-prototype
    paths:
      - .github/workflows/item7-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: stabilize/v2.0.0-prototype
          fetch-depth: 0

      - name: Restore complete sample route and apply canonical label audit fix
        run: python .github/scripts/item7_restore_sample_routes.py

      - name: Validate diff
        run: git diff --check

      - name: Commit safe sample route correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No reconciliation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/backend/src/interface/routes/sample.routes.js
          git commit -m 'fix(labels): use canonical specimenId in label audit'
          git push origin HEAD:stabilize/v2.0.0-prototype
