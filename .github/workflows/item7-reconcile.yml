name: Item 7 canonical v2 reconciliation

on:
  push:
    branches:
      - stabilize/v2.0.0-prototype
    paths:
      - .github/workflows/item7-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: stabilize/v2.0.0-prototype
          fetch-depth: 0

      - name: Apply deterministic notification persistence double
        run: python .github/scripts/item7_reconcile_notification.py

      - name: Validate diff
        run: git diff --check

      - name: Commit notification persistence reconciliation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No reconciliation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/backend/src/services/NotificationService.js \
            api/backend/tests/unit/NotificationService.test.js
          git commit -m 'test(notification): inject deterministic compliance persistence double'
          git push origin HEAD:stabilize/v2.0.0-prototype
