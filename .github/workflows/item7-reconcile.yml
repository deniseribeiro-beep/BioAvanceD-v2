name: Item 7 canonical v2 reconciliation

on:
  push:
    branches:
      - stabilize/v2.0.0-prototype
    paths:
      - .github/workflows/item7-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: stabilize/v2.0.0-prototype
          fetch-depth: 0

      - name: Apply reports fix and canonical specimenId boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace(path, old, new, required=True):
              text = read(path)
              if old in text:
                  text = text.replace(old, new)
                  write(path, text)
                  return
              if new in text:
                  return
              if required:
                  raise SystemExit(f'expected snippet not found in {path}: {old!r}')

          # Item 1: objective reports regression.
          path = 'api/backend/src/interface/routes/reports.routes.js'
          text = read(path)
          mongodb_import = "const { ObjectId } = require('mongodb');"
          if mongodb_import not in text:
              anchor = "const express = require('express');\n"
              if anchor not in text:
                  raise SystemExit('reports.routes.js express import anchor not found')
              text = text.replace(anchor, anchor + mongodb_import + "\n", 1)
              write(path, text)

          # Item 2: canonical physical boundary uses specimenId only.
          replace(
              'api/backend/src/interface/controllers/allocate-sample.controller.js',
              'const { sampleId, boxId, position } = req.body || {};',
              'const { specimenId, boxId, position } = req.body || {};'
          )
          replace(
              'api/backend/src/interface/controllers/allocate-sample.controller.js',
              'specimenId: sampleId,',
              'specimenId,'
          )

          replace(
              'api/backend/src/interface/controllers/move-sample.controller.js',
              'const { sampleId, targetBoxId, targetPosition, reason, notes } = req.body || {};',
              'const { specimenId, targetBoxId, targetPosition, reason, notes } = req.body || {};'
          )
          replace(
              'api/backend/src/interface/controllers/move-sample.controller.js',
              'specimenId: sampleId,',
              'specimenId,'
          )

          replace(
              'api/backend/src/interface/controllers/release-sample.controller.js',
              'const { sampleId } = req.params;',
              'const { specimenId } = req.params;'
          )
          replace(
              'api/backend/src/interface/controllers/release-sample.controller.js',
              'specimenId: sampleId,',
              'specimenId,'
          )

          replace(
              'api/backend/src/interface/controllers/storage-query.controller.js',
              'req.params.sampleId',
              'req.params.specimenId'
          )

          replace(
              'api/backend/src/interface/routes/storage.routes.js',
              "router.get('/sample/:sampleId', createGetSampleLocationController());",
              "router.get('/specimen/:specimenId', createGetSampleLocationController());"
          )
          replace(
              'api/backend/src/interface/routes/storage.routes.js',
              "router.delete('/release/:sampleId', requirePermission('manageStorageAllocation'), createReleaseSampleController());",
              "router.delete('/release/:specimenId', requirePermission('manageStorageAllocation'), createReleaseSampleController());"
          )

          # Frontend service keeps positional API but names/payloads canonical.
          p = 'frontend/src/services/storageApi.ts'
          text = read(p)
          text = text.replace('async allocateSample(sampleId: string, boxId: string, position: string)',
                              'async allocateSample(specimenId: string, boxId: string, position: string)')
          text = text.replace("api.post(`${API_STORAGE_BASE}/allocate`, { sampleId, boxId, position })",
                              "api.post(`${API_STORAGE_BASE}/allocate`, { specimenId, boxId, position })")
          text = text.replace('    sampleId: string,\n    targetBoxId: string,',
                              '    specimenId: string,\n    targetBoxId: string,')
          text = text.replace('        sampleId,\n        targetBoxId,',
                              '        specimenId,\n        targetBoxId,')
          text = text.replace('async releaseSample(sampleId: string)', 'async releaseSample(specimenId: string)')
          text = text.replace('`${API_STORAGE_BASE}/release/${sampleId}`', '`${API_STORAGE_BASE}/release/${specimenId}`')
          text = text.replace('async getCurrentStoragePlacement(sampleId: string)', 'async getCurrentStoragePlacement(specimenId: string)')
          text = text.replace('`${API_STORAGE_BASE}/sample/${sampleId}`', '`${API_STORAGE_BASE}/specimen/${specimenId}`')
          write(p, text)

          # Reconcile only tests that exercise the physical boundary. Do not touch E2E here.
          test_paths = [
              'api/backend/tests/integration/storage-allocation.api.test.js',
              'api/backend/tests/unit/allocate-release-sample.controller.test.js',
              'api/backend/tests/unit/move-sample.controller.test.js',
              'api/backend/tests/unit/storage-query.controller.test.js',
              'api/backend/tests/unit/storage.routes.test.js',
          ]
          for p in test_paths:
              text = read(p)
              text = re.sub(r'\bsampleId\b', 'specimenId', text)
              text = text.replace('/api/storage/sample/', '/api/storage/specimen/')
              text = text.replace('/release/:sampleId', '/release/:specimenId')
              write(p, text)

          # Fail if executable canonical physical boundary still exposes sampleId.
          boundary_paths = [
              'api/backend/src/interface/controllers/allocate-sample.controller.js',
              'api/backend/src/interface/controllers/move-sample.controller.js',
              'api/backend/src/interface/controllers/release-sample.controller.js',
              'api/backend/src/interface/controllers/storage-query.controller.js',
              'api/backend/src/interface/routes/storage.routes.js',
              'frontend/src/services/storageApi.ts',
          ]
          offenders = []
          for p in boundary_paths:
              if re.search(r'\bsampleId\b', read(p)):
                  offenders.append(p)
          if offenders:
              raise SystemExit('sampleId remains in canonical physical boundary: ' + ', '.join(offenders))
          PY

          git diff --check
          git diff -- api/backend/src/interface/routes/reports.routes.js \
            api/backend/src/interface/controllers \
            api/backend/src/interface/routes/storage.routes.js \
            frontend/src/services/storageApi.ts \
            api/backend/tests/integration/storage-allocation.api.test.js \
            api/backend/tests/unit/allocate-release-sample.controller.test.js \
            api/backend/tests/unit/move-sample.controller.test.js \
            api/backend/tests/unit/storage-query.controller.test.js \
            api/backend/tests/unit/storage.routes.test.js

      - name: Commit canonical reconciliation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No reconciliation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/backend/src/interface/routes/reports.routes.js \
            api/backend/src/interface/controllers/allocate-sample.controller.js \
            api/backend/src/interface/controllers/move-sample.controller.js \
            api/backend/src/interface/controllers/release-sample.controller.js \
            api/backend/src/interface/controllers/storage-query.controller.js \
            api/backend/src/interface/routes/storage.routes.js \
            frontend/src/services/storageApi.ts \
            api/backend/tests/integration/storage-allocation.api.test.js \
            api/backend/tests/unit/allocate-release-sample.controller.test.js \
            api/backend/tests/unit/move-sample.controller.test.js \
            api/backend/tests/unit/storage-query.controller.test.js \
            api/backend/tests/unit/storage.routes.test.js
          git commit -m 'fix(v2): canonicalize specimen storage boundary'
          git push origin HEAD:stabilize/v2.0.0-prototype
