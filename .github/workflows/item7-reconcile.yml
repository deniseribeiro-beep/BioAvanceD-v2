name: Item 7 canonical v2 reconciliation

on:
  push:
    branches:
      - stabilize/v2.0.0-prototype
    paths:
      - .github/workflows/item7-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: stabilize/v2.0.0-prototype
          fetch-depth: 0

      - name: Reconcile final Full Vitest failures against canonical v2
        run: python .github/scripts/item7_reconcile_final5.py

      - name: Validate diff
        run: git diff --check

      - name: Commit final functional reconciliation batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No reconciliation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/backend/tests/integration/storage-auto-allocation.api.test.js \
            api/backend/tests/unit/consent.service.unit.test.js
          git commit -m 'test(item7): align final assertions with canonical v2 identities'
          git push origin HEAD:stabilize/v2.0.0-prototype
