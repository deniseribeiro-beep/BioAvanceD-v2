name: Storage v2 one-time cleanup

on:
  push:
    branches:
      - stabilize/v2.0.0-prototype
    paths:
      - .github/workflows/storage-v2-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove final executable storage alias
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('api/backend/src/services/import-lgpd.service.js')
          text = path.read_text(encoding='utf-8')
          legacy = "            sample.storageLocation = { boxId: candidateLocation.boxId, position: candidateLocation.position };\n"
          if legacy not in text:
              raise SystemExit('Expected executable storage alias not found; refusing non-deterministic cleanup')
          text = text.replace(legacy, '', 1)
          text = text.replace(
              '// performs the atomic occupancyGrid write, storageLocation update,\n      // StorageAssignment record and audit/lineage trail — same use case',
              '// performs the atomic occupancyGrid write, canonical-v2 normalized\n      // assignment-chain persistence and audit/lineage trail — same use case',
              1,
          )
          text = text.replace(
              '// #459/#477: resolve a candidate storageLocation (boxId/positionCode)',
              '// #459/#477: resolve a candidate physical placement (boxId/positionCode)',
              1,
          )
          text = text.replace(
              '// write, storageLocation update, StorageAssignment record\n          // (dict-02 ELM-0167-0178) and audit/lineage trail for the\n          // candidate resolved above — replaces the old manual\n          // StorageAssignment insert, which never touched the box\'s\n          // occupancyGrid.',
              '// write, canonical-v2 normalized assignment-chain persistence\n          // (dict-02 ELM-0167-0178) and audit/lineage trail for the\n          // candidate resolved above.',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleanup and remove this workflow
        shell: bash
        run: |
          git config user.name "BioAvanceD CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/storage-v2-cleanup-once.yml
          git add api/backend/src/services/import-lgpd.service.js
          git commit -m "refactor(storage): remove final import storage alias"
          git push origin HEAD:stabilize/v2.0.0-prototype
