name: Wave 2 final reconciliation retry #1132

on:
  push:
    branches:
      - stabilize/v2.0.0-prototype
    paths:
      - .github/workflows/wave2-finalize-1132-retry.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilize/v2.0.0-prototype
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final Wave 2 reconciliation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count}, found {actual}: {old[:120]!r}')
              p.write_text(text.replace(old, new))
              print(f'patched {path}: {count}')

          replace_exact('api/backend/tests/architecture/filter-keys.arch.test.js', "    'services/consent.service.js'\n", "    'services/consent-v2.service.js'\n")
          replace_exact('api/backend/src/routes/intakeWizard.js', "const { validate } = require('../contracts/canonical/v1');\n", "const consentService = require('../services/consent.service');\n")

          old_consent = '''async function resolveConsentDecision(db, patient) {
            const patientIDs = buildIdVariants(patient?.participantId, patient?._id?.toString()).map(String);
            if (patientIDs.length === 0) {
              const error = new Error('Paciente sem identificador para validar consentimento ativo.');
              error.statusCode = 400;
              throw error;
            }

            const consentsCollection = await getCollection(db, 'consents');
            const activeConsent = await consentsCollection.findOne(
              {
                participantId: { $in: patientIDs },
                status: 'ACTIVE',
              },
              {
                sort: { signedAt: -1, updatedAt: -1, createdAt: -1 },
              }
            );

            if (activeConsent) {
              return {
                active: true,
                consentId: activeConsent._id || null,
                patientId: activeConsent.participantId || null,
                status: 'SIGNED',
                quarantineReason: null,
                governanceReason: null,
              };
            }

            const revokedConsent = await consentsCollection.findOne(
              {
                participantId: { $in: patientIDs },
                status: 'REVOKED',
              },
              {
                sort: { revokedAt: -1, updatedAt: -1, createdAt: -1 },
              }
            );

            if (revokedConsent) {
              return {
                active: false,
                consentId: revokedConsent._id || null,
                patientId: revokedConsent.participantId || null,
                status: 'REVOKED',
                quarantineReason: 'CONSENT_REVOKED',
                governanceReason: 'Consentimento revogado.',
              };
            }

            return {
              active: false,
              consentId: null,
              patientId: null,
              status: 'PENDING',
              quarantineReason: 'CONSENT_PENDING',
              governanceReason: 'Consentimento ainda não ativo/assinado.',
            };
          }'''.replace('          ', '')
          new_consent = '''async function resolveConsentDecision(db, patient) {
            const participantId = normalizeString(patient?.participantId);
            if (!participantId) {
              const error = new Error('Paciente sem identificador para validar consentimento ativo.');
              error.statusCode = 400;
              throw error;
            }

            const consent = await consentService.getPatientConsent(db, participantId);
            if (consent?.status === 'ACTIVE') {
              return {
                active: true,
                consentId: consent.consentId || consent._id || null,
                patientId: participantId,
                status: 'SIGNED',
                quarantineReason: null,
                governanceReason: null,
              };
            }
            if (consent?.status === 'REVOKED') {
              return {
                active: false,
                consentId: consent.consentId || consent._id || null,
                patientId: participantId,
                status: 'REVOKED',
                quarantineReason: 'CONSENT_REVOKED',
                governanceReason: 'Consentimento revogado.',
              };
            }
            return {
              active: false,
              consentId: null,
              patientId: participantId,
              status: 'PENDING',
              quarantineReason: 'CONSENT_PENDING',
              governanceReason: 'Consentimento ainda não ativo/assinado.',
            };
          }'''.replace('          ', '')
          replace_exact('api/backend/src/routes/intakeWizard.js', old_consent, new_consent)
          replace_exact('api/backend/src/routes/intakeWizard.js', "        parentSpecimenId: ['parentSampleId'],\n", "        parentSpecimenIds: ['parentSpecimenId'],\n")

          old_validation = '''    const validation = validate('canonical.v1.intake', data);
              if (!validation.valid) {
                const fields = [];
                for (const issue of validation.errors || []) {
                  const field = issue.instancePath?.replace(/^\\//, '').replace(/\\//g, '.') || issue.params?.missingProperty || null;
                  if (field) fields.push(field);
                }
                return res.status(422).json({ error: 'NON_CANONICAL_FIELD', fields: [...new Set(fields)] });
              }

          '''.replace('          ', '')
          replace_exact('api/backend/src/routes/intakeWizard.js', old_validation, '')

          for path, old, new in [
              ('api/backend/src/models/SampleFile.js', 'canonical.v1.file', 'canonical v2 DataFile'),
              ('api/backend/src/services/import-async.service.js', 'contracts/canonical/v1/index.js', 'contracts/canonical/v2/index.js'),
          ]:
              replace_exact(path, old, new)
          p = Path('api/backend/src/services/import-async.service.js')
          p.write_text(p.read_text().replace('canonical.v1.', 'canonical.v2.'))

          store_path = Path('api/backend/src/infrastructure/persistence/mongo/NormalizedPhysicalStorageStore.js')
          store = store_path.read_text()
          class_tail = '''  async findCurrentBySpecimens(specimenIds, session) {
            await this.ensureIndexes();
            const result = new Map();
            for (const specimenId of specimenIds || []) {
              result.set(String(specimenId), await this.findCurrentBySpecimen(specimenId, session));
            }
            return result;
          }
          }

          module.exports = NormalizedPhysicalStorageStore;'''.replace('          ', '')
          method_tail = '''  async findCurrentBySpecimens(specimenIds, session) {
            await this.ensureIndexes();
            const result = new Map();
            for (const specimenId of specimenIds || []) {
              result.set(String(specimenId), await this.findCurrentBySpecimen(specimenId, session));
            }
            return result;
          }

            async findSpecimenIdsByLocation({ boxIds = [], positionCode = null, session } = {}) {
              await this.ensureIndexes();
              const { storageRacks, storagePositions, containerPositionAssignments, specimenContainerAssignments } = this.collections();
              const boxKeys = [...new Set((boxIds || []).filter((value) => value !== undefined && value !== null && String(value).trim() !== '').map(String))];
              if (boxKeys.length === 0) return [];
              const queryOptions = session ? { session } : undefined;
              const racks = await storageRacks.find({ $expr: { $in: [{ $toString: '$sourceStorageBoxId' }, boxKeys] } }, queryOptions).toArray();
              const rackIds = racks.map((rack) => rack.storageRackId);
              if (rackIds.length === 0) return [];
              const positionFilter = { storageRackId: { $in: rackIds } };
              if (positionCode) positionFilter.positionCode = String(positionCode);
              const positions = await storagePositions.find(positionFilter, queryOptions).toArray();
              const positionIds = positions.map((position) => position.storagePositionId);
              if (positionIds.length === 0) return [];
              const placements = await containerPositionAssignments.find({ storagePositionId: { $in: positionIds }, removedAt: null }, queryOptions).toArray();
              const containerIds = placements.map((placement) => placement.containerId);
              if (containerIds.length === 0) return [];
              const assignments = await specimenContainerAssignments.find({ containerId: { $in: containerIds }, releasedAt: null }, queryOptions).toArray();
              return [...new Set(assignments.map((assignment) => String(assignment.specimenId)).filter(Boolean))];
            }
          }

          module.exports = NormalizedPhysicalStorageStore;'''.replace('          ', '')
          if store.count(class_tail) != 1:
              raise SystemExit(f'NormalizedPhysicalStorageStore.js structural tail count={store.count(class_tail)}')
          store_path.write_text(store.replace(class_tail, method_tail, 1))

          replace_exact('api/backend/src/interface/routes/reports.routes.js', "const rcsAssessmentService = require('../../services/rcs-assessment.service');\n", "const rcsAssessmentService = require('../../services/rcs-assessment.service');\nconst NormalizedPhysicalStorageStore = require('../../infrastructure/persistence/mongo/NormalizedPhysicalStorageStore');\n")
          reports_old = '''  // `localizacao` is the storageLocation.boxId/position snapshot Sample
            // carries (IStorageRepository.js's own framing), not a StorageAssignment
            // join. An unparseable boxId fails closed with a never-matching
            // condition rather than being dropped -- dropping it would be #741's
            // failure mode one dimension over.
            const storageBoxId = normalizeFilterText(filters.storageBoxId || filters.boxId);
            if (storageBoxId) {
              conditions.push({
                'storageLocation.boxId': /^[0-9a-f]{24}$/i.test(storageBoxId)
                  ? new ObjectId(storageBoxId)
                  : { $in: [] },
              });
            }

            const storagePosition = normalizeFilterText(filters.storagePosition || filters.position);
            if (storagePosition) {
              conditions.push({ 'storageLocation.position': storagePosition });
            }
          '''.replace('          ', '')
          reports_new = '''  const storageBoxId = normalizeFilterText(filters.storageBoxId || filters.boxId);
            const storagePosition = normalizeFilterText(filters.storagePosition || filters.position);
            if (storageBoxId || storagePosition) {
              const physicalStore = new NormalizedPhysicalStorageStore(db);
              const matchingSpecimenIds = storageBoxId
                ? await physicalStore.findSpecimenIdsByLocation({ boxIds: [storageBoxId], positionCode: storagePosition || null })
                : [];
              conditions.push({ specimenId: { $in: matchingSpecimenIds } });
            }
          '''.replace('          ', '')
          replace_exact('api/backend/src/interface/routes/reports.routes.js', reports_old, reports_new)
          replace_exact('api/backend/src/interface/routes/reports.routes.js', "const { ObjectId } = require('mongodb');\n", '')

          replace_exact('api/backend/src/services/equipment-sensor-quarantine.service.js', "const logger = require('../utils/logger');\n", "const logger = require('../utils/logger');\nconst NormalizedPhysicalStorageStore = require('../infrastructure/persistence/mongo/NormalizedPhysicalStorageStore');\n")
          old_filter = '''function buildSampleFilterFromBoxIds(boxIds = []) {
            if (!Array.isArray(boxIds) || boxIds.length === 0) {
              return null;
            }

            return { 'storageLocation.boxId': { $in: dedupeIds(boxIds) } };
          }'''.replace('          ', '')
          new_filter = '''async function buildSampleFilterFromBoxIds(db, boxIds = [], options = {}) {
            if (!Array.isArray(boxIds) || boxIds.length === 0) {
              return null;
            }
            const physicalStore = new NormalizedPhysicalStorageStore(db);
            const specimenIds = await physicalStore.findSpecimenIdsByLocation({ boxIds: dedupeIds(boxIds), session: options.session || null });
            return { specimenId: { $in: specimenIds } };
          }'''.replace('          ', '')
          replace_exact('api/backend/src/services/equipment-sensor-quarantine.service.js', old_filter, new_filter)
          replace_exact('api/backend/src/services/equipment-sensor-quarantine.service.js', '  const filter = buildSampleFilterFromBoxIds(boxIds);\n', '  const filter = await buildSampleFilterFromBoxIds(db, boxIds, options);\n', 2)
          replace_exact('api/backend/src/services/equipment-sensor-quarantine.service.js', '  const filter = buildSampleFilterFromBoxIds(dedupedBoxIds);\n', '  const filter = await buildSampleFilterFromBoxIds(db, dedupedBoxIds, options);\n')

          replace_exact('api/backend/tests/architecture/wave2-v2-invariants.arch.test.js', "    /^workers\\/neo4jProjection\\.worker\\.js$/,\n", "    /^workers\\/neo4jProjection\\.worker\\.js$/,\n    /^scripts\\/testEnvironment\\.js$/, // administrative test reset only\n")

          v1 = Path('api/backend/src/contracts/canonical/v1/index.js')
          if not v1.exists():
              raise SystemExit('canonical/v1/index.js missing before controlled deletion')
          v1.unlink()
          try: v1.parent.rmdir()
          except OSError: pass

          for wf in ['.github/workflows/wave2-finalize-1132-once.yml', '.github/workflows/wave2-finalize-1132-retry.yml']:
              p = Path(wf)
              if p.exists(): p.unlink()
          PY
      - name: Install backend dependencies
        working-directory: api/backend
        run: npm ci
      - name: Validate Wave 2 architecture before commit
        working-directory: api/backend
        run: npm run test:architecture
      - name: Commit reconciled Wave 2 state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix(wave2): eliminate final v1 and storage authority residuals (#1132)"
          git push origin HEAD:stabilize/v2.0.0-prototype
