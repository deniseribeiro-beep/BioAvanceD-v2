name: PR System Audit

on:
  pull_request:
    branches:
      - main

jobs:
  backend-observability:
    name: Backend Observability Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run backend tests with observability coverage
        shell: bash
        run: |
          mkdir -p reports/system-audit/backend
          set -o pipefail
          npx --prefix backend vitest run \
            tests/integration/sample.api.test.js \
            tests/unit/topologicalQuarantine.test.js \
            tests/unit/topologicalQuarantine.observability.test.js \
            2>&1 | tee reports/system-audit/backend/vitest-observability.log

      - name: Upload backend audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-system-audit-${{ github.run_id }}
          path: reports/system-audit/backend
          if-no-files-found: warn

  frontend-e2e:
    name: Frontend Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Playwright browsers
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Run Playwright suites and capture logs/traces
        shell: bash
        run: |
          mkdir -p reports/system-audit/playwright
          set -o pipefail
          npm --prefix frontend run test:e2e -- \
            playwright/tests/login.spec.js \
            playwright/tests/cadastro-amostra.spec.js \
            2>&1 | tee reports/system-audit/playwright/playwright-run.log

      - name: Upload Playwright audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-system-audit-${{ github.run_id }}
          path: reports/system-audit/playwright
          if-no-files-found: warn
