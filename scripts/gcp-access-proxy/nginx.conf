worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 50m;

  # LB / IAP health checks and browsers hit this proxy; upstream stays loopback-only.
  # Reach services on the compose network bioavanced-test (not host loopback).
  upstream bioavanced_frontend {
    server frontend-app-test:5173;
  }

  upstream bioavanced_backend {
    server backend-app-test:3000;
  }

  upstream bioavanced_mailpit {
    server smtp-test:8025;
  }

  server {
    listen 8080;
    server_name bioadvanced.dev www.bioadvanced.dev _;

    location = /mailpit {
      return 302 /mailpit/;
    }

    location /mailpit/ {
      proxy_pass http://bioavanced_mailpit/mailpit/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 120s;
    }

    location /api/ {
      proxy_pass http://bioavanced_backend/api/;
      proxy_http_version 1.1;
      # $http_host keeps the non-default port (e.g. :8080 tunnel); $host strips it.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_read_timeout 120s;
    }

    location / {
      proxy_pass http://bioavanced_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
