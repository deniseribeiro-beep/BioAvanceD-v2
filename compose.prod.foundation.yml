services:
  foundation-bootstrap:
    # RF022 / Foundation v2.0.0 em produção: one-shot após os healthchecks
    # dos stores e antes da liberação de API e workers.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.prod
    command: ["node", "scripts/run-foundation-data-pipeline.js"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      tsa:
        condition: service_healthy
      witness:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - storage_data:/data/storage

  backend:
    depends_on:
      foundation-bootstrap:
        condition: service_completed_successfully

  worker:
    depends_on:
      foundation-bootstrap:
        condition: service_completed_successfully

  neo4j-projection-worker:
    depends_on:
      foundation-bootstrap:
        condition: service_completed_successfully
