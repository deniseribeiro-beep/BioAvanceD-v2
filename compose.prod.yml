name: bioavanced-prod

services:
  mongodb:
    image: mongo:7.0.45
    restart: unless-stopped
    # RNF014 C3: CPU and memory limits on every service. No reference
    # environment is documented, so these are a starting point to revisit
    # against measured use.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_REPLICA_SET_KEY: ${MONGO_REPLICA_SET_KEY:?MONGO_REPLICA_SET_KEY is required}
    # RF023 AC3, RNF019 C1 (#1550): a single-node replica set, so an aggregate
    # write and its outbox event commit in one transaction; a standalone mongod
    # takes no transaction. With root credentials set, mongod demands
    # --keyFile for a replica set, so the key is written from the environment
    # to a root-only file before the image's entrypoint is re-entered, which
    # still creates the root user and drops to the mongodb user.
    command: ["bash", "-c", "set -eu; umask 077; printf '%s' \"$$MONGO_REPLICA_SET_KEY\" > /etc/mongo-replica-set.key; chown mongodb:mongodb /etc/mongo-replica-set.key; chmod 0400 /etc/mongo-replica-set.key; exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /etc/mongo-replica-set.key --bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--username", "${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}", "--password", "${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo-rs-init:
    # RF023 AC3 (#1550): one-shot; initiates the single-node replica set from
    # outside mongod's own process, as compose.test.yml's mongo-rs-init-test
    # does, and exits 0; a set already initiated passes. Every service that
    # writes MongoDB waits for it. The credentials reach mongosh through the
    # environment, never its --password, so no command line visible in `ps`
    # carries them.
    image: mongo:7.0.45
    restart: "no"
    user: "999:999"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    environment:
      HOME: /tmp
      MONGO_RS_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_RS_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    command: ["bash", "-c", "for i in $$(seq 1 30); do if mongosh --quiet --host mongodb --eval 'db.getSiblingDB(\"admin\").auth(process.env.MONGO_RS_USERNAME, process.env.MONGO_RS_PASSWORD); try { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongodb:27017\" }] }); } catch (e) { if (!/already initialized/.test(e.message)) { throw e; } } while (rs.status().myState !== 1) { sleep(500); }'; then exit 0; fi; sleep 2; done; exit 1"]
    depends_on:
      mongodb:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=16m,mode=1777

  neo4j:
    image: neo4j:5.26.32-community
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:?NEO4J_USERNAME is required}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      # RNF014 C3: keep the JVM heap and page cache inside the 2g memory limit.
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USERNAME:?NEO4J_USERNAME is required}", "-p", "${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  influxdb:
    image: influxdb:2.7.12
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME:?INFLUXDB_INIT_USERNAME is required}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD:?INFLUXDB_INIT_PASSWORD is required}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:?INFLUXDB_ORG is required}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:?INFLUXDB_BUCKET is required}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?INFLUXDB_TOKEN is required}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    # #965: production Redis requires auth. Without this the server accepted
    # unauthenticated connections while validateEnv.js:44 demanded a
    # REDIS_PASSWORD outside development -- and that mismatch was FATAL for
    # the worker: import-worker.js:39 -> worker.js:44 lets validateRedisOnly's
    # throw escape, so `worker` crashlooped on a stack whose backend was
    # healthy. The backend survived only because queue.js catches it and logs.
    # Same variable the app reads, so the two cannot drift.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD e obrigatorio}"]
    environment:
      # redis-cli reads REDISCLI_AUTH, so the healthcheck authenticates
      # without putting the password on a command line visible in `ps`.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD e obrigatorio}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  tsa:
    build:
      context: ./infra/tsa
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    # A stack whose tsa_*/witness_secrets volumes predate #1470 chowns them once:
    # docker run --rm -v bioavanced-prod_tsa_certs:/a -v bioavanced-prod_tsa_state:/b -v bioavanced-prod_tsa_secrets:/c -v bioavanced-prod_witness_secrets:/d alpine:3.20.3 chown -R 10001:10001 /a /b /c /d
    # RNF014 C3 (#1470): non-root, the uid the image's app user and its writable paths carry.
    user: "10001:10001"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    environment:
      PORT: "8095"
      TSA_CONFIG: /etc/tsa/openssl-ts.cnf
      TSA_SECTION: tsa_config
    read_only: true
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    # #955: read_only:true above is correct and stays, but entrypoint.sh writes
    # to all three of these paths and none was writable, so "set -eu" aborted
    # the script before it reached exec "$@" and the container never started --
    # taking backend and frontend with it via depends_on: service_healthy.
    # Named volumes rather than tmpfs because the CA key material generated
    # here must SURVIVE a restart: regenerating it silently invalidates every
    # timestamp the TSA has ever issued.
    # /etc/tsa itself is deliberately NOT the mount point -- openssl-ts.cnf is
    # baked into the image there (#954), and a volume over /etc/tsa would
    # freeze the first build's copy of it forever.
    volumes:
      - tsa_certs:/etc/tsa/certs
      - tsa_state:/var/lib/tsa
      - tsa_secrets:/run/secrets
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8095/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  witness:
    build:
      context: ./infra/witness
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    # RNF014 C3 (#1470): non-root, the uid the image's app user and its writable paths carry.
    user: "10001:10001"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    environment:
      PORT: "8096"
      WITNESS_ID: bioavanced-prod-witness
      WITNESS_PRIVATE_KEY_PEM_FILE: /run/secrets/witness_key.pem
    read_only: true
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    # #955: entrypoint.sh writes /run/secrets/witness_key.pem, which is on the
    # read-only rootfs. Persisted for the same reason as the TSA's key -- a
    # regenerated witness key invalidates every signature it has co-signed.
    volumes:
      - witness_secrets:/run/secrets
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8096/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  foundation:
    # RF022 AC4, RNF014 C6/C7: the Foundation Data Pipeline as a one-shot
    # job, separate from the API's startup and run before it. It does
    # dry-run, apply and verify, writes a ReadinessReport, and exits
    # non-zero when that report is blocked; backend and both workers wait
    # for it to complete successfully, and the backend re-checks the report
    # itself (FOUNDATION_READINESS_REQUIRED). The same prod image as the
    # backend; the direct node form for the same reason as worker's (#955).
    build:
      context: ./api/backend
      dockerfile: Dockerfile.prod
    init: true
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    command: ["node", "scripts/seed-essential-reference-data.js"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-rs-init:
        condition: service_completed_successfully
    read_only: true
    cap_drop: ["ALL"]

  essential-references:
    # RF022 AC7, plano §5: Phase 2 for the essential reference set (MIABIS
    # and SPREC minimal, RCS-GOV 1.0), which the Foundation job prepares
    # and does not load. It runs on a ready ReadinessReport and exits 1
    # without one; the backend waits for it.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.prod
    init: true
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    command: ["node", "scripts/load-essential-references.js"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    depends_on:
      foundation:
        condition: service_completed_successfully
    read_only: true
    cap_drop: ["ALL"]

  backend:
    build:
      context: ./api/backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      CHOKIDAR_USEPOLLING: "false"
      # RF022 AC9, RNF014 C7: refuse to start without a ready ReadinessReport.
      FOUNDATION_READINESS_REQUIRED: "true"
    depends_on:
      foundation:
        condition: service_completed_successfully
      # RF022 AC7: the essential reference set, loaded in Phase 2.
      essential-references:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      mongo-rs-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      tsa:
        condition: service_healthy
      witness:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    # #893: the app writes uploads, staged import files, sample/result
    # attachments and backups. read_only:true is correct and stays -- what was
    # wrong is that those paths were hardcoded under /app, the one place a
    # hardened container must not be writable. UPLOAD_DIR/STORAGE_DIR/BACKUP_DIR
    # (.env.production.example) move them here. The worker mounts the SAME
    # volumes: the API writes the staged file and the worker reads it back by
    # the absolute path in rawData.storagePath, which is why compose.test.yml
    # already shares uploads-test-data between its own pair.
    volumes:
      - uploads_data:/data/uploads
      - storage_data:/data/storage
      - backups_data:/data/backups
      # The worker runs daily-merkle.job and the backend serves POST /api/audit/anchor; both readFile the signing key (#989, #978).
      - ./infra/audit/prod/secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    # Runs import-worker.js and the per-entity workers under
    # src/workers/workers/*.js (#310, follow-up from #309) — without
    # this service the import-worker pipeline never runs in a
    # production compose deployment, mirroring the dev compose worker.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    # #955: was "npm run worker". package.json:10 aliases a plain
    # "node ./src/workers/worker.js", so the npm layer buys nothing and costs a
    # process that wants a writable $HOME/.npm -- "adduser -S app"
    # (api/backend/Dockerfile.prod:20) puts /home/app on the read-only rootfs.
    # direct form is also signal-transparent under "init: true" above.
    command: ["node", "./src/workers/worker.js"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # RF022 AC9, RNF014 C7 (#1551): the import worker refuses to start without a ready ReadinessReport.
      FOUNDATION_READINESS_REQUIRED: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/worker-heartbeat');if(Date.now()-s.mtimeMs>60000)process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    depends_on:
      # RNF014 C7: workers start only after a successful Foundation job.
      foundation:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      mongo-rs-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    # #893: same three volumes as backend, and they must be the same ones --
    # the worker reads back files the API wrote, by absolute path.
    volumes:
      - uploads_data:/data/uploads
      - storage_data:/data/storage
      - backups_data:/data/backups
      # The worker runs daily-merkle.job and the backend serves POST /api/audit/anchor; both readFile the signing key (#989, #978).
      - ./infra/audit/prod/secrets:/run/secrets:ro

  neo4j-projection-worker:
    # Drains graph_projection_outbox into Neo4j (#309, follow-up from RF023/#292)
    # — without this service, outbox rows written by consent.service.js
    # (and future appendLineageEvent/appendQualityEvent/appendTelemetryEvent
    # callers) sit PENDING forever and the graph projection never happens.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    # #955: same as the worker service above -- package.json:26 aliases
    # "node src/workers/neo4jProjection.worker.js".
    command: ["node", "src/workers/neo4jProjection.worker.js"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      # RF022 AC9, RNF014 C7 (#1551): the graph projection worker refuses to start without a ready ReadinessReport.
      FOUNDATION_READINESS_REQUIRED: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/neo4j-projection-heartbeat');if(Date.now()-s.mtimeMs>60000)process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    depends_on:
      # RNF014 C7: workers start only after a successful Foundation job.
      foundation:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      mongo-rs-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=64m,mode=1777

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    env_file:
      - .env.production
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    # #955: read_only:true with no tmpfs and no volumes -- nginx could not
    # write its pid file or any proxy/client temp path, so the container could
    # never start. frontend/Dockerfile.prod:30 chowns these to "app", which fixes
    # ownership and not read-onlyness. nginx.conf overrides neither "pid" nor
    # any *_temp_path, and it is a conf.d/ server block so it cannot: "pid" is
    # a main-context directive. mode=1777 matches the /tmp idiom already used
    # throughout this file; the image runs as USER app, not root.
    tmpfs:
      - /var/cache/nginx:size=32m,mode=1777
      - /var/run:size=8m,mode=1777
    # #924: was `node -e "fetch(...)"`, copied from the backend's healthcheck.
    # The backend runs node:22-alpine; this service's runtime stage is
    # nginx:1.27-alpine, which ships no node binary -- verified by running the
    # image: `command -v wget` -> /usr/bin/wget, `command -v node` -> absent.
    # So the old check could never pass and this container could only ever be
    # unhealthy. Nothing in this file waits on it with
    # `condition: service_healthy`, which is the only reason the stack still
    # came up at all.
    #
    # BusyBox wget is the idiom compose.test.yml:624 already uses.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mongodb_data:
  neo4j_data:
  influxdb_data:
  redis_data:
  # #893: writable application data, deliberately outside /app so backend and
  # worker keep read_only:true.
  uploads_data:
  storage_data:
  backups_data:
  # #955: the TSA/witness key material and the TSA serial counter. These are
  # not caches -- losing them invalidates previously issued timestamps and
  # signatures, which is why they are named volumes and not tmpfs.
  tsa_certs:
  tsa_state:
  tsa_secrets:
  witness_secrets:
