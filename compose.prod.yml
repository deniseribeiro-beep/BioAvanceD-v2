name: bioavanced-prod

services:
  mongo-keyfile-init:
    image: mongo:7
    user: "0:0"
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -eu
        if [ ! -s /mongo-keyfile/keyfile ]; then
          openssl rand -base64 756 > /mongo-keyfile/keyfile
        fi
        chown 999:999 /mongo-keyfile/keyfile
        chmod 400 /mongo-keyfile/keyfile
    volumes:
      - mongodb_keyfile:/mongo-keyfile

  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/run/mongodb-keyfile/keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    volumes:
      - mongodb_data:/data/db
      - mongodb_keyfile:/run/mongodb-keyfile:ro
    depends_on:
      mongo-keyfile-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username '$${MONGO_INITDB_ROOT_USERNAME}' --password '$${MONGO_INITDB_ROOT_PASSWORD}' --authenticationDatabase admin --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mongo-rs-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongodb:
        condition: service_started
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -eu
        for i in $$(seq 1 60); do
          if mongosh --host mongodb --quiet \
            --username "$$MONGO_ROOT_USERNAME" \
            --password "$$MONGO_ROOT_PASSWORD" \
            --authenticationDatabase admin --eval '
              try {
                rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] });
              } catch (e) {
                if (!/already initialized/.test(e.message)) { throw e; }
              }
              quit(db.hello().isWritablePrimary ? 0 : 1);
            '; then
            exit 0
          fi
          sleep 2
        done
        echo "MongoDB replica set rs0 did not become PRIMARY" >&2
        exit 1

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:?NEO4J_USERNAME is required}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USERNAME:?NEO4J_USERNAME is required}", "-p", "${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME:?INFLUXDB_INIT_USERNAME is required}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD:?INFLUXDB_INIT_PASSWORD is required}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:?INFLUXDB_ORG is required}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:?INFLUXDB_BUCKET is required}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?INFLUXDB_TOKEN is required}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD e obrigatorio}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD e obrigatorio}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  tsa:
    build:
      context: ./infra/tsa
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PORT: "8095"
      TSA_CONFIG: /etc/tsa/openssl-ts.cnf
      TSA_SECTION: tsa_config
    read_only: true
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - tsa_certs:/etc/tsa/certs
      - tsa_state:/var/lib/tsa
      - tsa_secrets:/run/secrets
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8095/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  witness:
    build:
      context: ./infra/witness
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PORT: "8096"
      WITNESS_ID: bioavanced-prod-witness
      WITNESS_PRIVATE_KEY_PEM_FILE: /run/secrets/witness_key.pem
    read_only: true
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - witness_secrets:/run/secrets
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8096/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./api/backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    init: true
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      CHOKIDAR_USEPOLLING: "false"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      tsa:
        condition: service_healthy
      witness:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - uploads_data:/data/uploads
      - storage_data:/data/storage
      - backups_data:/data/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    build:
      context: ./api/backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    init: true
    command: ["node", "./src/workers/worker.js"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/worker-heartbeat');if(Date.now()-s.mtimeMs>60000)process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - uploads_data:/data/uploads
      - storage_data:/data/storage
      - backups_data:/data/backups

  neo4j-projection-worker:
    build:
      context: ./api/backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    init: true
    command: ["node", "src/workers/neo4jProjection.worker.js"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/neo4j-projection-heartbeat');if(Date.now()-s.mtimeMs>60000)process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=64m,mode=1777

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    init: true
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    env_file:
      - .env.production
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    tmpfs:
      - /var/cache/nginx:size=32m,mode=1777
      - /var/run:size=8m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mongodb_data:
  mongodb_keyfile:
  neo4j_data:
  influxdb_data:
  redis_data:
  uploads_data:
  storage_data:
  backups_data:
  tsa_certs:
  tsa_state:
  tsa_secrets:
  witness_secrets:
