services:
  backend:
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      ALLOWED_ORIGINS: http://frontend,http://nginx,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./backend:/app
      - backend_nodemodules:/app/node_modules
      - backend_backups:${BACKUP_DIR:-/app/backups}

  frontend:
    image: node:20-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      VITE_API_BASE_URL: /api
      VITE_PROXY_TARGET: http://backend:3000
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_nodemodules:/app/node_modules

volumes:
  backend_nodemodules:
  frontend_nodemodules:
