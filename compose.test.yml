name: bioavanced-test

# #1157: audit-keygen-test writes the public-key registry for THIS key id, and
# the backend/worker read the registry back by it. Anchored so the two cannot
# drift into a silent signature_unknown_key_id.
x-audit-key-id: &audit-key-id audit-ed25519-test-1

# #1419 (RF007 AC2, RNF016 C4): the stack stores DataFile binaries in the
# S3-compatible s3-test service, not the filesystem store.
x-object-store-env: &object-store-env
  OBJECT_STORE_DRIVER: s3
  OBJECT_STORE_S3_ENDPOINT: http://s3-test:9000
  OBJECT_STORE_S3_BUCKET: bioavanced-test-files
  OBJECT_STORE_S3_REGION: us-east-1
  OBJECT_STORE_S3_ACCESS_KEY_ID: bioavanced-s3-test
  OBJECT_STORE_S3_SECRET_ACCESS_KEY: bioavanced-s3-test-secret

x-test-env: &test-env
  # #1419: on the shared anchor, so every container built from it (the API and
  # worker-test included) reads and writes the one S3 store.
  <<: *object-store-env
  NODE_ENV: test
  MONGO_URI: mongodb://mongodb-test:27017/bioavanced_test?replicaSet=rs0
  MONGO_DB: bioavanced_test
  MONGO_DB_NOVO: bioavanced_test
  NEO4J_URI: bolt://neo4j-test:7687
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: testpassword
  # neo4j:5-community only supports the default `neo4j` database — named
  # databases are an Enterprise-only feature (#292: "Graph not found:
  # bioavanced_test" once RF023's e2e spec actually queried Neo4j).
  NEO4J_DATABASE: neo4j
  REDIS_URL: redis://redis-test:6379
  INFLUXDB_URL: http://influxdb-test:8086
  INFLUXDB_TOKEN: bioavanced-test-token
  INFLUXDB_ORG: bioavanced-test
  INFLUXDB_BUCKET: bioavanced-test
  MQTT_ENABLED: "false"
  SMTP_HOST: smtp-test
  SMTP_PORT: "1025"
  JWT_SECRET: vitest-secret-key
  JWT_REFRESH_SECRET: vitest-refresh-secret-key
  ENCRYPTION_KEY: vitest-encryption-key-for-lab-validation-32b
  ENCRYPTION_KEY_ID: vitest-key-001
  RESEND_API_KEY: vitest-resend-api-key
  EMAIL_FROM: onboarding@resend.dev
  ALERT_EMAIL_TO: e2e-admin@bioavanced.test
  USER_ANON_SALT: vitest-user-anon-salt
  CONSENT_SECRET: vitest-consent-secret-key
  # #829: required by NotificationService.getFrontendUrl(), which throws when
  # it is empty -- and POST /e-consent/generate-link had no try/catch, so that
  # throw exited the API process. It was set nowhere in this file or
  # .env.test.example, so that endpoint had never worked on this stack.
  #
  # NOT localhost: sendConsentEmail always calls
  # validateFrontendUrl({ remote: true }), which rejects any non-HTTPS or
  # loopback host outright -- correctly, since the alternative is emailing a
  # real participant a link to their own machine. So the test value has to be
  # an HTTPS non-loopback placeholder; it is never resolved, because the specs
  # that follow an emailed link strip it to the pathname and navigate relative
  # to PLAYWRIGHT_BASE_URL.
  FRONTEND_URL: https://e2e.bioavanced.test
  ALLOW_CLOUD_INTEGRATIONS: "false"
  ALLOW_EXTERNAL_TERMINOLOGY_SYNC: "false"
  ALLOW_EXTERNAL_HPO_LOOKUP: "false"
  ALLOW_EXTERNAL_DRUG_LOOKUP: "false"
  BOOTSTRAP_ADMIN_NAME: "E2E Test Admin"
  BOOTSTRAP_ADMIN_EMAIL: e2e-admin@bioavanced.test
  BOOTSTRAP_ADMIN_USERNAME: admin
  BOOTSTRAP_ADMIN_TEMP_PASSWORD: Admin@123-e2e-stack
  # RF014 AC#4 (#648): createFirstAdmin.js's forceReset:true is now actually
  # enforced at login (previously dormant) -- every spec here logs in
  # directly as TEST_USER/TEST_PASS via realLogin(), with no forced-reset
  # step of its own, so the bootstrap admin must skip it. Explicit opt-out
  # (never inferred from NODE_ENV, same isolated-flag shape
  # ENABLE_TEST_SUPPORT_ROUTES already uses below) -- a real production or
  # dev-stack bootstrap keeps the default (unset = forceReset:true).
  BOOTSTRAP_ADMIN_FORCE_RESET: "false"
  TEST_SUPPORT_SECRET: e2e-test-support-secret
  # #675: test-support routes also require this explicit opt-in to be
  # registered at all, on top of NODE_ENV/TEST_SUPPORT_SECRET above --
  # see utils/testSupportGate.js. This stack is exactly the "controlled
  # suite" the flag exists for.
  ENABLE_TEST_SUPPORT_ROUTES: "true"
  # #1091: machine-ingest credential for POST /api/iot/telemetry
  # (utils/machineIngestGate.js). Fails closed like TEST_SUPPORT_SECRET
  # above -- unset means every request 403s regardless of header. The
  # specs send it as the x-telemetry-ingest-secret header.
  TELEMETRY_INGEST_SECRET: e2e-telemetry-ingest-secret
  # #959: these live on the SHARED anchor, not on backend-app-test alone.
  # The container that runs the sealing job is worker-test, which inherits
  # only <<: *test-env -- so while these sat in backend-app-test's own
  # environment block, audit-tsa.service.js threw
  # "AUDIT_RFC3161_TSA_URL nao configurado" in the one process that needed it.
  #
  # The /tsa and /witness SUFFIXES are load-bearing and were missing: the
  # servers answer POST on exactly those paths (infra/tsa/tsa-server.js,
  # infra/witness/witness-server.js) and 404 everything else, and
  # audit-tsa.service.js fetches the configured URL verbatim. Without them
  # every request landed on the 404 branch -> tsa_http_404 ->
  # PENDING_TIMESTAMP, indistinguishable from a TSA that was never called.
  # .env.docker.example already had the suffixed form; these were the outlier.
  AUDIT_RFC3161_TSA_URL: http://tsa-test:8095/tsa
  AUDIT_EXTERNAL_WITNESS_URL: http://witness-test:8096/witness
  AUDIT_EXTERNAL_WITNESS_PUBLIC_KEY: ""
  # #959 item 2: both signing chains -- audit-signing.provider.js#loadPrivateKey
  # and merkle-envelope.service.js#getPrivateKeyPem -- readFile() whatever this
  # names and throw otherwise, and createTreeHead calls them inside a try/FINALLY,
  # so the throw propagates and runOnce swallows it. Before this, POST
  # /api/audit/anchor answered 500 "Audit signing key must be provided via
  # AUDIT_MERKLE_SIGN_PRIVATE_KEY_FILE" and audit_tree_heads stayed empty on every
  # stack that has ever run. The key itself is minted per stack by
  # audit-keygen-test, never committed -- same posture as infra/witness, whose
  # secrets/ directory tracks only a .gitkeep.
  AUDIT_MERKLE_SIGN_PRIVATE_KEY_FILE: /run/secrets/merkle_signing_key.pem
  AUDIT_MERKLE_SIGN_KEY_ID: *audit-key-id
  # #1157: the registry has to be the SPKI half of a key that does not exist
  # until audit-keygen-test runs, and compose resolves its environment at parse
  # time -- so the JSON env var it used to be read from could never carry it,
  # and every sealed root recorded publicKeyFingerprint: null while
  # processTimestampBacklog would have stamped it FAILED/signature_unknown_key_id.
  # The keygen one-shot now writes this file beside the private key, in the same
  # volume, and the provider prefers it over the env var (which stays the
  # fallback for the host-side generator the dev stack uses).
  AUDIT_MERKLE_SIGN_PUBLIC_KEYS_FILE: /run/secrets/merkle_signing_public_keys.json

services:
  mongodb-test:
    image: mongo:7.0.45
    environment:
      MONGO_INITDB_DATABASE: bioavanced_test
    # Single-node replica set (#297): sample.service.js's withdrawSample/
    # returnSample need client.startSession()/withTransaction() to keep the
    # ledger append and balance update atomic, and MongoDB only supports
    # multi-document transactions on a replica set — a standalone mongod
    # rejects sessions outright ("not running with --replSet"). rs.initiate()
    # itself runs from the separate mongo-rs-init-test service below, not
    # from a docker-entrypoint-initdb.d script here — running it in-process
    # right after startup hit a reproducible "isSelf could not connect"
    # NodeNotFound error (mongod dialing its own advertised bridge address
    # this early gets refused, seemingly a hairpin-NAT limitation), whereas
    # a separate container connecting in normally, after the healthcheck
    # confirms the port is reachable, does not.
    #
    # #1440 / lab GCP e2-highcpu-16 (~16 GiB): mongod's default WiredTiger
    # cache is ~half of host RAM (~7 GiB). Under the full compose.test stack
    # (Neo4j, Influx, backend, Playwright Chromium, …) that balloons into
    # OOM pressure. Cap the cache and container so the gate can finish on
    # this machine size.
    #
    # Same issue #1440 (exit 14): RF013 restore e2e creates a scratch DB with
    # many collections; with Docker's default nofile=1024 WiredTiger hits
    # EMFILE ("Too many open files"), panics, and mongod fasserts. Raise
    # nofile for this service.
    command:
      [
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--wiredTigerCacheSizeGB",
        "1.5",
      ]
    mem_limit: 2500m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - mongodb-test-data:/data/db
    ports:
      # Host-side access for e2e fixture helpers (tests/e2e/helpers/) that
      # seed data directly (e.g. consentTemplates — no API seed path exists,
      # see issue #294). npm run test:e2e:docker runs Playwright from the
      # host, mirroring backend-app-test/frontend-app-test's published ports.
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [bioavanced-test]

  # One-shot: initiates the single-node replica set from outside mongod's
  # own process (see the note on mongodb-test above), then exits 0.
  # backend-app-test and everything else that needs transactions depends on
  # this completing, not just on mongodb-test being healthy.
  mongo-rs-init-test:
    image: mongo:7.0.45
    depends_on:
      mongodb-test:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        for i in $(seq 1 20); do
          if mongosh --host mongodb-test --quiet --eval '
            try {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb-test:27017" }] });
            } catch (e) {
              if (!/already initialized/.test(e.message)) { throw e; }
            }
            while (rs.status().myState !== 1) { sleep(500); }
          '; then
            exit 0
          fi
          sleep 1
        done
        exit 1
    networks: [bioavanced-test]

  neo4j-test:
    image: neo4j:5.26.32-community
    environment:
      NEO4J_AUTH: neo4j/testpassword
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    volumes:
      - neo4j-test-data:/data
    ports:
      # Host-side access for e2e fixture helpers (tests/e2e/helpers/) that
      # query Neo4j directly to prove outbox projection (RF023, #292) — same
      # rationale as mongodb-test's/influxdb-test's published ports above.
      - "127.0.0.1:${NEO4J_BOLT_HOST_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p testpassword 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks: [bioavanced-test]

  redis-test:
    image: redis:7.4.11-alpine
    volumes:
      - redis-test-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [bioavanced-test]

  mqtt-test:
    image: eclipse-mosquitto:2.1.2-alpine
    # #1516: the image's default config listens on loopback only, so no other
    # container could reach this broker. Its bundled no-auth config listens on
    # 1883 on every interface and takes anonymous clients: test-only broker,
    # reachable on the compose network and the host's loopback alone.
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    ports:
      # #1516: host-side e2e runs publish here, in influxdb-test's loopback form.
      - "127.0.0.1:${MQTT_HOST_PORT:-1883}:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 >/dev/null 2>&1 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [bioavanced-test]

  influxdb-test:
    image: influxdb:2.7.12
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: bioavanced
      DOCKER_INFLUXDB_INIT_PASSWORD: bioavanced-test-password
      DOCKER_INFLUXDB_INIT_ORG: bioavanced-test
      DOCKER_INFLUXDB_INIT_BUCKET: bioavanced-test
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: bioavanced-test-token
    ports:
      # Host-side access for e2e fixture helpers (tests/e2e/helpers/) that
      # query InfluxDB directly to prove telemetry persistence (RF009, #289)
      # — same rationale as mongodb-test's published port above.
      # #1156: published host ports are overridable, as compose.dev.yml has always
      # made all ten of its own. The default keeps every existing invocation and CI
      # byte-identical. It matters because Windows reserves dynamic port ranges:
      # 8086 fell inside 8010-8109 on a dev machine, the publish failed with "An
      # attempt was made to access a socket in a way forbidden by its access
      # permissions", and because one failed publish abandons a multi-service `up`,
      # backend/worker/frontend/projection-worker were all left in Created. There was
      # no supported way out: the port was a literal. Names match .env.docker.example.
      - "127.0.0.1:${INFLUXDB_HOST_PORT:-8086}:8086"
    volumes:
      - influxdb-test-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD-SHELL", "influx ping --host http://127.0.0.1:8086 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [bioavanced-test]

  smtp-test:
    image: axllent/mailpit:v1.21.8
    environment:
      MP_WEBROOT: /mailpit
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/mailpit/api/v1/info >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [bioavanced-test]

  # #1419 (RF007 AC2, RNF016 C4): the S3-compatible store the backend's S3
  # driver writes DataFile binaries to. Not minio/minio: pulls of minio/minio
  # and quay.io/minio/minio were refused as unauthorized on 2026-10-30 (#1419).
  # pgsty/minio is a maintained MinIO build on docker.io that ships curl for the
  # healthcheck, pinned to an exact release as every third-party image here is.
  # Host loopback only (docs/decisions/2026-10-23-compose-ports-loopback.md),
  # and S3_HOST_PORT moves it as the other published ports move (#1156).
  s3-test:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: bioavanced-s3-test
      MINIO_ROOT_PASSWORD: bioavanced-s3-test-secret
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-9000}:9000"
    volumes:
      - s3-test-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [bioavanced-test]

  # #1419: creates the s3-test bucket once, before the backend starts. It signs
  # the CreateBucket PUT with the backend's own awsSigV4.js (mounted read-only at
  # /s3), so no S3 client image is pulled; a bucket this stack already made is
  # reused. Not named *bootstrap*: scripts/e2e-gate.sh waits on those by name.
  s3-bucket-init-test:
    image: node:22.23.4-alpine
    command: ["node", "/init/s3-bucket-init.cjs"]
    environment: *object-store-env
    volumes:
      - ./tests/e2e/docker:/init:ro
      - ./api/backend/src/infrastructure/objectStorage:/s3:ro
    depends_on:
      s3-test:
        condition: service_healthy
    networks: [bioavanced-test]

  # #959 item 2: mints the Merkle signing key this stack signs tree heads with.
  # Modelled on infra/witness/entrypoint.sh, which does the same for the witness
  # key: generate on first use into a named volume, reuse it afterwards. Nothing
  # is committed -- git tracks no key material anywhere in this repo, and
  # infra/tsa/secrets and infra/witness/secrets hold only a .gitkeep.
  #
  # Reuse matters rather than being mere tidiness: audit_roots documents already
  # signed under a key are verified against it later, so regenerating per bring-up
  # would orphan every artifact a previous run produced on the same volume.
  audit-keygen-test:
    image: node:22.23.4-alpine
    command:
      - node
      - -e
      - |
        const { generateKeyPairSync, createPrivateKey, createPublicKey } = require('crypto');
        const { writeFileSync, readFileSync, existsSync, mkdirSync } = require('fs');
        const path = '/run/secrets/merkle_signing_key.pem';
        const registryPath = '/run/secrets/merkle_signing_public_keys.json';
        const keyId = process.env.AUDIT_MERKLE_SIGN_KEY_ID;
        mkdirSync('/run/secrets', { recursive: true });
        if (existsSync(path)) {
          console.log('audit signing key: reusing ' + path);
        } else {
          const { privateKey } = generateKeyPairSync('ed25519');
          writeFileSync(path, privateKey.export({ format: 'pem', type: 'pkcs8' }).toString(), { mode: 0o600 });
          console.log('audit signing key: generated ' + path);
        }
        // #1157: derive the registry from whatever key is on disk on EVERY run,
        // not only when minting. A volume created before this existed holds a
        // key and no registry, and the reuse branch above is the path it takes.
        const publicPem = createPublicKey(createPrivateKey(readFileSync(path, 'utf8')))
          .export({ format: 'pem', type: 'spki' }).toString();
        writeFileSync(registryPath, JSON.stringify({ [keyId]: publicPem }, null, 2));
        console.log('audit public key registry: wrote ' + registryPath + ' for keyId ' + keyId);
    environment:
      # Only the key id: the registry this mints is keyed by it, and the app
      # reads it back by the same anchor.
      AUDIT_MERKLE_SIGN_KEY_ID: *audit-key-id
    volumes:
      - audit-signing-test-data:/run/secrets
    networks: [bioavanced-test]

  tsa-test:
    build:
      context: ./infra/tsa
    environment:
      TSA_PORT: "8095"
    expose:
      - "8095"
    healthcheck:
      # #981: probe the port the service was actually told to use. This
      # hardcoded 8095, which is also tsa-server.js's fallback -- so before
      # TSA_PORT was wired up, changing it left the server on 8095 and this
      # check passing, and the only symptom was a connection refused from
      # another container.
      #
      # The $$ is load-bearing: a single $ is interpolated by Compose at
      # config-parse time against the HOST environment, where TSA_PORT does
      # not exist, so it renders to the literal 8095 and nothing is gained.
      # $$ escapes it through to the container's shell, where TSA_PORT is
      # set. Verified with `docker compose -f compose.test.yml config`.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${TSA_PORT:-8095}/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [bioavanced-test]

  witness-test:
    build:
      context: ./infra/witness
    environment:
      WITNESS_PORT: "8096"
      WITNESS_ID: bioavanced-test-witness
    expose:
      - "8096"
    healthcheck:
      # #981: same as tsa-test above -- probe the configured port, not a
      # literal that happens to equal the server's fallback. The $$ escape
      # matters for the same reason; see that comment.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${WITNESS_PORT:-8096}/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [bioavanced-test]

  backend-app-test:
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    environment:
      <<: *test-env
      RUN_SERVER_IN_TEST: "1"
      # #1392: the e2e stack proves enforce; every e2e sensor is bound by tests/e2e/helpers/seedSensor.ts.
      # `enforce` is also the code default since #1392; the stack sets it explicitly.
      TELEMETRY_BINDING_MODE: enforce
      # #1263: trust X-Forwarded-For only from loopback, which in this
      # container's network namespace is trusted-hop-test below and nothing
      # else. The runner, the frontend and the host's published 3000 all
      # connect from other addresses, so their requests keep their socket
      # address as req.ip, exactly as under TRUST_PROXY=0. Test stack only:
      # production keeps TRUST_PROXY=0 (.env.production.example) unless a
      # real proxy that clients cannot reach is in front.
      TRUST_PROXY: loopback
      # #981: TSA_URL was set here and read by NOTHING -- git grep over the
      # whole tracked tree found this line and no reader. The variable the
      # code actually reads is AUDIT_RFC3161_TSA_URL, which 67ac5405 moved
      # onto the shared anchor above (with the load-bearing /tsa suffix this
      # line was missing). So this was a near-miss name carrying the exact
      # unsuffixed value that #959 item 4 had just finished fixing. Removed.
      # RF022 AC9, RNF014 C7: refuse to start without a ready ReadinessReport.
      FOUNDATION_READINESS_REQUIRED: "true"
      # #1467: the platform alert check runs every 10 s on the test stack so the
      # RNF015 C2 e2e proof sees a tick inside one test; the code default stays */5 * * * *.
      PLATFORM_ALERT_CRON: "*/10 * * * * *"
      # #1516: the API subscribes to mqtt-test so the e2e stack proves MQTT
      # telemetry beside HTTPS (RF009, RNF004 C6). This overrides the anchor's
      # "false" for this service only; worker-test and the bootstraps keep it off.
      MQTT_ENABLED: "true"
      MQTT_URL: mqtt://mqtt-test:1883
    command: ["npm", "start"]
    # #828: the API writes the uploaded staging file to /app/uploads and the
    # worker reads it back by absolute path (staging-import.service.js ->
    # rawData.storagePath, resolved in batch-validation-engine.service.js).
    # They are separate containers, so without a shared mount the worker
    # throws "Arquivo bruto do staging nao encontrado" and the batch import
    # never completes. compose.dev.yml does not have this problem because it
    # bind-mounts ./api/backend:/app into both services.
    #
    # This is scaffolding for the shared-filesystem assumption, not an
    # endorsement of it -- #893 records why storing the bytes (GridFS) is the
    # real fix, and that change deletes this mount.
    volumes:
      - uploads-test-data:/app/uploads
      # The signed TCLE and its evidence live under STORAGE_BASE (/app/storage).
      # Without this mount a backend recreate drops the ciphertext the consent
      # still points at, and Ver/Baixar answers 404.
      - storage-test-data:/app/storage
      # #959 item 2: read-only -- the app signs with this key and must never be
      # able to rewrite it. POST /api/audit/anchor runs in THIS process and
      # reaches the same signing chains as the nightly worker job, so the backend
      # needs the key too, not just worker-test.
      - audit-signing-test-data:/run/secrets:ro
    depends_on:
      audit-keygen-test:
        condition: service_completed_successfully
      mongodb-test:
        condition: service_healthy
      mongo-rs-init-test:
        condition: service_completed_successfully
      # RF022 AC4: the Foundation job before the API, never after it.
      foundation-bootstrap-test:
        condition: service_completed_successfully
      # RF022 AC7: the essential reference set, loaded in Phase 2.
      essential-reference-bootstrap-test:
        condition: service_completed_successfully
      neo4j-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      influxdb-test:
        condition: service_healthy
      smtp-test:
        condition: service_healthy
      tsa-test:
        condition: service_healthy
      witness-test:
        condition: service_healthy
      # #1419: the S3 store and its bucket before the first upload.
      s3-bucket-init-test:
        condition: service_completed_successfully
      # #1516: started, not healthy: mqtt-test's healthcheck ends in
      # `|| exit 0` and proves nothing, and the API's client reconnects every 5 s.
      mqtt-test:
        condition: service_started
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3000}:3000"
      # #1263: trusted-hop-test shares this service's network namespace, so
      # its port is published here (a network_mode service cannot publish).
      # Host loopback only, as every published port here is
      # (docs/decisions/2026-10-23-compose-ports-loopback.md): the hop lets its
      # caller choose a source address.
      - "127.0.0.1:${TRUSTED_HOP_HOST_PORT:-3100}:3100"
    expose:
      - "3000"
      - "3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [bioavanced-test]

  # #1263: the one hop the backend trusts (TRUST_PROXY: loopback above). It
  # runs in backend-app-test's network namespace and forwards :3100 to the
  # backend's 127.0.0.1:3000 byte for byte, so a request sent through it
  # reaches Express from loopback with its own X-Forwarded-For intact, and
  # req.ip becomes the address the spec chose. That gives a spec a source
  # address of its own, so it can drive the source-address and
  # unusual-activity blocks without blocking the one address every other
  # spec shares. Never copy this into a production stack: it lets any caller
  # that reaches :3100 choose its address.
  trusted-hop-test:
    image: node:22.23.4-alpine
    command: ["node", "/hop/loopback-forward.cjs", "0.0.0.0:3100=127.0.0.1:3000"]
    volumes:
      - ./tests/e2e/docker:/hop:ro
    network_mode: "service:backend-app-test"
    depends_on:
      backend-app-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  admin-bootstrap-test:
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    environment:
      <<: *test-env
    command: ["npm", "run", "admin:create-first"]
    depends_on:
      backend-app-test:
        condition: service_healthy
    networks: [bioavanced-test]

  foundation-bootstrap-test:
    # RF022 (#371): the Foundation Data Pipeline's one-shot job, mirroring
    # compose.dev.yml's `foundation-bootstrap`. RF022 AC4 and RNF014 C6/C7:
    # it runs after the datastores are healthy and BEFORE the API, separate
    # from the API's own startup. It does dry-run, apply and verify, writes a
    # ReadinessReport, and exits non-zero when that report is blocked, so
    # backend-app-test's service_completed_successfully dependency below
    # holds the API back; the API also re-checks the report itself
    # (FOUNDATION_READINESS_REQUIRED). It populates no reference data
    # (RF022 AC7). pipeline-continuity.spec.ts asserts what it records.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    environment:
      <<: *test-env
    command: ["npm", "run", "seed:essential"]
    depends_on:
      mongodb-test:
        condition: service_healthy
      mongo-rs-init-test:
        condition: service_completed_successfully
    networks: [bioavanced-test]

  essential-reference-bootstrap-test:
    # RF022 AC7, plano §5: Phase 2 for the essential reference set (MIABIS
    # and SPREC minimal, RCS-GOV 1.0), which Foundation prepares and does
    # not load. It runs on a ready ReadinessReport, exits 1 without one, and
    # records a ReferenceImportRun per entry. backend-app-test waits for it,
    # since sample registration reads these catalogs. $setOnInsert makes
    # repeat runs insert nothing.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    environment:
      <<: *test-env
    command: ["npm", "run", "reference:load:essential"]
    depends_on:
      foundation-bootstrap-test:
        condition: service_completed_successfully
    networks: [bioavanced-test]

