name: bioavanced-test

x-test-env: &test-env
  NODE_ENV: test
  TEST_ENVIRONMENT: "true"
  MONGO_URI: mongodb://mongodb-test:27017/bioavanced_test
  MONGO_DB: bioavanced_test
  MONGO_DB_NOVO: bioavanced_test
  NEO4J_URI: bolt://neo4j-test:7687
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: testpassword
  NEO4J_DATABASE: bioavanced_test
  REDIS_URL: redis://redis-test:6379
  INFLUXDB_URL: http://influxdb-test:8086
  INFLUXDB_TOKEN: bioavanced-test-token
  INFLUXDB_ORG: bioavanced-test
  INFLUXDB_BUCKET: bioavanced-test
  MQTT_ENABLED: "false"
  SMTP_HOST: smtp-test
  SMTP_PORT: "1025"
  JWT_SECRET: vitest-secret-key
  JWT_REFRESH_SECRET: vitest-refresh-secret-key
  ENCRYPTION_KEY: vitest-encryption-key-for-lab-validation-32b
  ENCRYPTION_KEY_ID: vitest-key-001
  RESEND_API_KEY: vitest-resend-api-key
  EMAIL_FROM: onboarding@resend.dev
  USER_ANON_SALT: vitest-user-anon-salt
  CONSENT_SECRET: vitest-consent-secret-key
  ALLOW_CLOUD_INTEGRATIONS: "false"
  ALLOW_EXTERNAL_TERMINOLOGY_SYNC: "false"
  ALLOW_EXTERNAL_HPO_LOOKUP: "false"
  ALLOW_EXTERNAL_DRUG_LOOKUP: "false"
  BOOTSTRAP_ADMIN_NAME: "E2E Test Admin"
  BOOTSTRAP_ADMIN_EMAIL: e2e-admin@bioavanced.test
  BOOTSTRAP_ADMIN_USERNAME: admin
  BOOTSTRAP_ADMIN_TEMP_PASSWORD: Admin@123
  TEST_SUPPORT_SECRET: e2e-test-support-secret

services:
  mongodb-test:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: bioavanced_test
    volumes:
      - mongodb-test-data:/data/db
    ports:
      # Host-side access for e2e fixture helpers (tests/e2e/helpers/) that
      # seed data directly (e.g. consentTemplates — no API seed path exists,
      # see issue #294). npm run test:e2e:docker runs Playwright from the
      # host, mirroring backend-app-test/frontend-app-test's published ports.
      - "27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [bioavanced-test]

  neo4j-test:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/testpassword
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    volumes:
      - neo4j-test-data:/data
    ports:
      # Host-side access for e2e fixture helpers (tests/e2e/helpers/) that
      # query Neo4j directly to prove outbox projection (RF023, #292) — same
      # rationale as mongodb-test's/influxdb-test's published ports above.
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p testpassword 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks: [bioavanced-test]

  redis-test:
    image: redis:7-alpine
    volumes:
      - redis-test-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [bioavanced-test]

  mqtt-test:
    image: eclipse-mosquitto:2
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 >/dev/null 2>&1 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [bioavanced-test]

  influxdb-test:
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: bioavanced
      DOCKER_INFLUXDB_INIT_PASSWORD: bioavanced-test-password
      DOCKER_INFLUXDB_INIT_ORG: bioavanced-test
      DOCKER_INFLUXDB_INIT_BUCKET: bioavanced-test
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: bioavanced-test-token
    ports:
      # Host-side access for e2e fixture helpers (tests/e2e/helpers/) that
      # query InfluxDB directly to prove telemetry persistence (RF009, #289)
      # — same rationale as mongodb-test's published port above.
      - "8086:8086"
    volumes:
      - influxdb-test-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD-SHELL", "influx ping --host http://127.0.0.1:8086 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [bioavanced-test]

  smtp-test:
    image: axllent/mailpit:v1.21.8
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/api/v1/info >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [bioavanced-test]

  tsa-test:
    build:
      context: ./infra/tsa
    environment:
      TSA_PORT: "8095"
    expose:
      - "8095"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8095/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [bioavanced-test]

  witness-test:
    build:
      context: ./infra/witness
    environment:
      WITNESS_PORT: "8096"
      WITNESS_ID: bioavanced-test-witness
    expose:
      - "8096"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8096/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [bioavanced-test]

  backend-app-test:
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    environment:
      <<: *test-env
      RUN_SERVER_IN_TEST: "1"
      TSA_URL: http://tsa-test:8095
      AUDIT_RFC3161_TSA_URL: http://tsa-test:8095
      AUDIT_EXTERNAL_WITNESS_URL: http://witness-test:8096
      AUDIT_EXTERNAL_WITNESS_PUBLIC_KEY: ""
    command: ["npm", "start"]
    depends_on:
      mongodb-test:
        condition: service_healthy
      neo4j-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      influxdb-test:
        condition: service_healthy
      smtp-test:
        condition: service_healthy
      tsa-test:
        condition: service_healthy
      witness-test:
        condition: service_healthy
    ports:
      - "3000:3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [bioavanced-test]

  admin-bootstrap-test:
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    environment:
      <<: *test-env
    command: ["npm", "run", "admin:create-first"]
    depends_on:
      backend-app-test:
        condition: service_healthy
    networks: [bioavanced-test]

  worker-test:
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    environment:
      <<: *test-env
    command: ["npm", "run", "worker"]
    depends_on:
      backend-app-test:
        condition: service_healthy
    networks: [bioavanced-test]

  neo4j-projection-worker-test:
    # Drains graph_projection_outbox into Neo4j (RF023, #292) — nothing else
    # in this stack runs neo4jProjection.worker.js; without this service
    # outbox rows sit PENDING forever and pipeline-continuity.spec.ts's
    # polling assertions would time out regardless of backend correctness.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    environment:
      <<: *test-env
    command: ["npm", "run", "neo4j:canonical:worker"]
    depends_on:
      backend-app-test:
        condition: service_healthy
    networks: [bioavanced-test]

  frontend-app-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      # Baked in at Vite dev-server start, consumed by the browser that loads
      # the app — that's the *host* browser via the published 5173 port for
      # the per-spec/host-based Playwright workflow (test:e2e:docker), which
      # can't resolve compose-internal hostnames like backend-app-test.
      VITE_API_BASE_URL: http://localhost:3000/api
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: frontend-app-test
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      backend-app-test:
        condition: service_healthy
    ports:
      - "5173:5173"
    expose:
      - "5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [bioavanced-test]

  backend-unit-runner:
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    environment:
      <<: *test-env
    volumes:
      - ./frontend:/frontend:ro
    command: ["npm", "run", "current-state:ci"]
    depends_on:
      mongodb-test:
        condition: service_healthy
      neo4j-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      influxdb-test:
        condition: service_healthy
      smtp-test:
        condition: service_healthy
    networks: [bioavanced-test]

  frontend-unit-runner:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: http://backend-app-test:3000/api
      CI: "true"
    command: ["npm", "run", "test:unit:coverage"]
    depends_on:
      frontend-app-test:
        condition: service_healthy
    networks: [bioavanced-test]

  playwright-runner:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    environment:
      CI: "true"
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
      PLAYWRIGHT_BASE_URL: http://frontend-app-test:5173
      PLAYWRIGHT_API_BASE_URL: http://backend-app-test:3000
      TEST_USER: admin
      TEST_PASS: Admin@123
      E2E_MONGO_URI: mongodb://mongodb-test:27017
      E2E_MONGO_DB: bioavanced_test
      TEST_SUPPORT_SECRET: e2e-test-support-secret
    depends_on:
      frontend-app-test:
        condition: service_healthy
      backend-app-test:
        condition: service_healthy
      mongodb-test:
        condition: service_healthy
    networks: [bioavanced-test]

networks:
  bioavanced-test:
    driver: bridge

volumes:
  mongodb-test-data:
  neo4j-test-data:
  redis-test-data:
  influxdb-test-data:

