  worker-test:
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    environment:
      <<: *test-env
      # #1392: the import worker writes temperature readings, so it binds them as backend-app-test does.
      TELEMETRY_BINDING_MODE: enforce
    command: ["npm", "run", "worker"]
    # #828: same volume as backend-app-test -- this is the reading half.
    volumes:
      - uploads-test-data:/app/uploads
      - storage-test-data:/app/storage
      # #959 item 2: the nightly daily-merkle job signs here.
      - audit-signing-test-data:/run/secrets:ro
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/worker-heartbeat');if(Date.now()-s.mtimeMs>60000)process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    depends_on:
      audit-keygen-test:
        condition: service_completed_successfully
      # #959: worker-test runs daily-merkle.job, which reaches the TSA and the
      # witness. It depended on neither, so on a cold bring-up the job could
      # fire against services that were not up yet.
      tsa-test:
        condition: service_healthy
      witness-test:
        condition: service_healthy
      backend-app-test:
        condition: service_healthy
    networks: [bioavanced-test]

  neo4j-projection-worker-test:
    # Drains graph_projection_outbox into Neo4j (RF023, #292) — nothing else
    # in this stack runs neo4jProjection.worker.js; without this service
    # outbox rows sit PENDING forever and pipeline-continuity.spec.ts's
    # polling assertions would time out regardless of backend correctness.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    environment:
      <<: *test-env
    command: ["npm", "run", "neo4j:canonical:worker"]
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/neo4j-projection-heartbeat');if(Date.now()-s.mtimeMs>60000)process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    depends_on:
      backend-app-test:
        condition: service_healthy
    networks: [bioavanced-test]

  frontend-app-test:
    # #891/#819: a pre-built bundle served by `vite preview`, not a dev server.
    # There is no bind mount here and cannot be one -- a reproducible test stack
    # bakes its source in (Dockerfile.dev's `COPY . .`) -- so dev mode bought no
    # HMR while costing a per-route on-demand transform inside each spec's 5s
    # expect budget, plus a 300ms polling watcher over an immutable tree.
    # Service name, ports, healthcheck and network are unchanged, so
    # playwright-runner, frontend-unit-runner's depends_on, test:e2e:docker and
    # ci-pipeline.yml all keep working untouched.
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      target: preview
      args:
        # Baked in at BUILD time now -- a static bundle reads no container env.
        # Same value the dev server was given, and for the same reason: it is
        # consumed by the *host* browser via the published 5173 port for the
        # per-spec/host-based Playwright workflow (test:e2e:docker), which can't
        # resolve compose-internal hostnames like backend-app-test.
        VITE_API_BASE_URL: http://localhost:3000/api
    command: ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    depends_on:
      backend-app-test:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    expose:
      - "5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [bioavanced-test]

  backend-unit-runner:
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    environment:
      <<: *test-env
    volumes:
      - ./frontend:/frontend:ro
      # #658: `current-state:ci` runs `dictionary:validate`, whose SOURCE_MD
      # resolves to REPO_ROOT/docs/... where REPO_ROOT is
      # path.join(__dirname, '..', '..', '..'). In-container __dirname is
      # /app/scripts, so that walks /app/scripts -> /app -> / and clamps at
      # the filesystem root: the script looks for
      # /docs/docs-7-27-2026/extracted/dict-02_DICIONARIO.md. Hence /docs,
      # not /app/docs -- mounting it under the workdir would not be found.
      - ./docs:/docs:ro
      # #1413: mock-return-keys.arch.test.js reads tests/unit and
      # tests/integration, which api/backend/.dockerignore keeps out of the
      # image for #947, so they are mounted read-only from the checkout.
      - ./api/backend/tests/unit:/app/tests/unit:ro
      - ./api/backend/tests/integration:/app/tests/integration:ro
    command: ["npm", "run", "current-state:ci"]
    depends_on:
      mongodb-test:
        condition: service_healthy
      neo4j-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      influxdb-test:
        condition: service_healthy
      smtp-test:
        condition: service_healthy
    networks: [bioavanced-test]

  frontend-unit-runner:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: http://backend-app-test:3000/api
      CI: "true"
    command: ["npm", "run", "test:unit:coverage"]
    depends_on:
      frontend-app-test:
        condition: service_healthy
    networks: [bioavanced-test]

  playwright-runner:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    environment:
      CI: "true"
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
      # #1233: the bundle's API base is baked as http://localhost:3000/api, so
      # the browser here must load the app from localhost too. The image's CMD
      # forwards this container's localhost:5173/:3000 to the two services,
      # which makes origin, API base, CORS and cookies match a host-side run.
      # The API base goes through the forwarder too: the e-consent specs assert
      # the browser's API origin equals this one.
      PLAYWRIGHT_BASE_URL: http://localhost:5173
      PLAYWRIGHT_API_BASE_URL: http://localhost:3000
      TEST_USER: admin
      TEST_PASS: Admin@123-e2e-stack
      E2E_MONGO_URI: mongodb://mongodb-test:27017
      E2E_MONGO_DB: bioavanced_test
      TEST_SUPPORT_SECRET: e2e-test-support-secret
      # #1091: this service's environment block is flat and does not merge
      # x-test-env, so the anchor's TELEMETRY_INGEST_SECRET above is
      # repeated here -- same reason TEST_SUPPORT_SECRET is repeated on the
      # line above.
      TELEMETRY_INGEST_SECRET: e2e-telemetry-ingest-secret
      # #1233: the Neo4j and InfluxDB fixture helpers default to localhost,
      # which reaches the published ports only from the host, not from here.
      E2E_NEO4J_URI: bolt://neo4j-test:7687
      E2E_INFLUXDB_URL: http://influxdb-test:8086
      # #1516: same reason for the MQTT publisher helper (#1233): its
      # localhost default reaches only the host-side published port.
      E2E_MQTT_URL: mqtt://mqtt-test:1883
      # #1263: the trusted hop. Reached by service name, not through the
      # loopback forwarder: only API calls go to it, never the browser. The
      # spec's default, http://localhost:3100, is the host-side form.
      E2E_TRUSTED_HOP_URL: http://backend-app-test:3100
    depends_on:
      frontend-app-test:
        condition: service_healthy
      backend-app-test:
        condition: service_healthy
      trusted-hop-test:
        condition: service_healthy
      mongodb-test:
        condition: service_healthy
    networks: [bioavanced-test]

networks:
  bioavanced-test:
    driver: bridge

volumes:
  mongodb-test-data:
  neo4j-test-data:
  redis-test-data:
  influxdb-test-data:
  # #828: shared /app/uploads for backend-app-test and worker-test.
  uploads-test-data:
  # Signed TCLE ciphertext (objstore://consents/...) survives a backend recreate.
  storage-test-data:
  # #959 item 2: holds the Merkle signing key audit-keygen-test mints. Named, so
  # it survives a down/up and the key stays stable across runs of this stack.
  audit-signing-test-data:
  # #1419: the s3-test bucket and the DataFile objects in it.
  s3-test-data:

