services:
  mongodb:
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db

  neo4j:
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-7474}:7474"
      - "${NEO4J_BOLT_HOST_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data

  influxdb:
    ports:
      - "${INFLUXDB_HOST_PORT:-8086}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2

  redis:
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  tsa:
    ports:
      - "${TSA_HOST_PORT:-8095}:8095"
    volumes:
      - ./infra/tsa/openssl-ts.cnf:/etc/tsa/openssl-ts.cnf:ro
      - ./infra/tsa/data:/var/lib/tsa
      - ./infra/tsa/certs:/etc/tsa/certs
      - ./infra/tsa/secrets:/run/secrets

  witness:
    ports:
      - "${WITNESS_HOST_PORT:-8096}:8096"
    volumes:
      - ./infra/witness/secrets:/run/secrets

  backend:
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    command: npx nodemon --legacy-watch --inspect=0.0.0.0:9229 server.js
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
      - "${BACKEND_DEBUG_HOST_PORT:-9229}:9229"
    volumes:
      - ./api/backend:/app
      - backend_node_modules:/app/node_modules
      - ./orpha-data-raw:/workspace/orpha-data-raw:ro
      - ./artifacts:/workspace/artifacts
    env_file:
      - .env.docker.example
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      tsa:
        condition: service_healthy
      witness:
        condition: service_healthy

  worker:
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    command: npm run worker
    volumes:
      - ./api/backend:/app
      - backend_node_modules:/app/node_modules
      - ./artifacts:/workspace/artifacts
    env_file:
      - .env.docker.example
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env.docker.example
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      WATCHPACK_POLLING: "true"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_data:
  neo4j_data:
  influxdb_data:
  redis_data:
  backend_node_modules:
  frontend_node_modules:

