services:
  mongodb:
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db

  neo4j:
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-7474}:7474"
      - "${NEO4J_BOLT_HOST_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data

  influxdb:
    ports:
      - "${INFLUXDB_HOST_PORT:-8086}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2

  redis:
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  tsa:
    ports:
      - "${TSA_HOST_PORT:-8095}:8095"
    volumes:
      - ./infra/tsa/openssl-ts.cnf:/etc/tsa/openssl-ts.cnf:ro
      - ./infra/tsa/data:/var/lib/tsa
      - ./infra/tsa/certs:/etc/tsa/certs
      - ./infra/tsa/secrets:/run/secrets

  witness:
    ports:
      - "${WITNESS_HOST_PORT:-8096}:8096"
    volumes:
      - ./infra/witness/secrets:/run/secrets

  backend:
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    command: npx nodemon --legacy-watch --inspect=0.0.0.0:9229 server.js
    ports:
      - "${BACKEND_HOST_PORT:-3000}:3000"
      - "${BACKEND_DEBUG_HOST_PORT:-9229}:9229"
    volumes:
      - ./api/backend:/app
      - backend_node_modules:/app/node_modules
      - ./orpha-data-raw:/workspace/orpha-data-raw:ro
      - ./artifacts:/workspace/artifacts
    env_file:
      - .env.docker
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      tsa:
        condition: service_healthy
      witness:
        condition: service_healthy

  worker:
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    command: npm run worker
    volumes:
      - ./api/backend:/app
      - backend_node_modules:/app/node_modules
      - ./artifacts:/workspace/artifacts
    env_file:
      - .env.docker
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  foundation-bootstrap:
    # RF022 (#366 slice 1): one-shot, idempotent essential-reference-data
    # seed, coupled to build/startup instead of a script a human has to
    # remember to run. Runs once per `up` after the backend is healthy;
    # upsertDocs's $setOnInsert makes repeat runs no-ops.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    command: npm run seed:essential
    volumes:
      - ./api/backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env.docker
    depends_on:
      backend:
        condition: service_healthy

  reference-data-bootstrap:
    # RF028 (#367 slice 1): one-shot, idempotent HPO reference-data import —
    # first of the 14 Fase 2 sources, runs after foundation-bootstrap so
    # Fase 1 schemas/collections are ready first (Plano Integrado Fase 2
    # dependency). Idempotent via the run's idempotencyKey lookup; repeat
    # runs are no-ops.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    command: npm run reference:import:hpo
    volumes:
      - ./api/backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env.docker
    depends_on:
      foundation-bootstrap:
        condition: service_completed_successfully

  reference-data-bootstrap-mondo:
    # RF028 (#548): one-shot, idempotent MONDO reference-data import — second
    # of the 14 Fase 2 sources (Plano Integrado §7.4 step 3, right after
    # HPO). Runs after reference-data-bootstrap completes, matching the
    # documented recommended order. Idempotent via the run's idempotencyKey
    # lookup; repeat runs are no-ops.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    command: npm run reference:import:mondo
    volumes:
      - ./api/backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env.docker
    depends_on:
      reference-data-bootstrap:
        condition: service_completed_successfully

  reference-data-bootstrap-orpha:
    # RF028 (#549): one-shot, idempotent ORPHA reference-data import — third
    # of the 14 Fase 2 sources (Plano Integrado §7.4 step 4, leading the
    # "ORPHA, CID-11, CID-10 e OMIM" group right after MONDO). Runs after
    # reference-data-bootstrap-mondo completes, matching the documented
    # recommended order. Idempotent via the run's idempotencyKey lookup;
    # repeat runs are no-ops.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    command: npm run reference:import:orpha
    volumes:
      - ./api/backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env.docker
    depends_on:
      reference-data-bootstrap-mondo:
        condition: service_completed_successfully

  reference-data-bootstrap-icd11:
    # RF028 (#549): one-shot, idempotent ICD-11 reference-data import —
    # fourth of the 14 Fase 2 sources (Plano Integrado §7.4 step 4, second
    # member of the "ORPHA, CID-11, CID-10 e OMIM" group, right after
    # ORPHA). Runs after reference-data-bootstrap-orpha completes, matching
    # the documented recommended order. Idempotent via the run's
    # idempotencyKey lookup; repeat runs are no-ops.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    command: npm run reference:import:icd11
    volumes:
      - ./api/backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env.docker
    depends_on:
      reference-data-bootstrap-orpha:
        condition: service_completed_successfully

  reference-data-bootstrap-icd10:
    # RF028 (#549): one-shot, idempotent ICD-10 reference-data import —
    # fifth of the 14 Fase 2 sources (Plano Integrado §7.4 step 4, third
    # member of the "ORPHA, CID-11, CID-10 e OMIM" group, right after
    # ICD-11). Runs after reference-data-bootstrap-icd11 completes, matching
    # the documented recommended order. Idempotent via the run's
    # idempotencyKey lookup; repeat runs are no-ops.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    command: npm run reference:import:icd10
    volumes:
      - ./api/backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env.docker
    depends_on:
      reference-data-bootstrap-icd11:
        condition: service_completed_successfully

  reference-data-bootstrap-omim:
    # RF028 (#549): one-shot, idempotent OMIM reference-data import — sixth
    # of the 14 Fase 2 sources (Plano Integrado §7.4 step 4, closing out the
    # "ORPHA, CID-11, CID-10 e OMIM" group, right after ICD-10). Runs after
    # reference-data-bootstrap-icd10 completes, matching the documented
    # recommended order. Idempotent via the run's idempotencyKey lookup;
    # repeat runs are no-ops.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    command: npm run reference:import:omim
    volumes:
      - ./api/backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env.docker
    depends_on:
      reference-data-bootstrap-icd10:
        condition: service_completed_successfully

  reference-data-bootstrap-hgnc:
    # RF028 (#549): one-shot, idempotent HGNC reference-data import —
    # seventh of the 14 Fase 2 sources (Plano Integrado §7.4 step 5,
    # "Importar HGNC e relações gene-fenótipo/doença", right after the
    # §7.4 step 4 group closes out with OMIM). Runs after
    # reference-data-bootstrap-omim completes, matching the documented
    # recommended order. Idempotent via the run's idempotencyKey lookup;
    # repeat runs are no-ops.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    command: npm run reference:import:hgnc
    volumes:
      - ./api/backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env.docker
    depends_on:
      reference-data-bootstrap-omim:
        condition: service_completed_successfully

  reference-data-bootstrap-loinc:
    # RF028 (#549): one-shot, idempotent LOINC reference-data import —
    # eighth of the 14 Fase 2 sources (Plano Integrado §7.4 step 6,
    # "Importar LOINC e UCUM", leading the pair right after HGNC). Runs
    # after reference-data-bootstrap-hgnc completes, matching the
    # documented recommended order. Idempotent via the run's
    # idempotencyKey lookup; repeat runs are no-ops.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    command: npm run reference:import:loinc
    volumes:
      - ./api/backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env.docker
    depends_on:
      reference-data-bootstrap-hgnc:
        condition: service_completed_successfully

  reference-data-bootstrap-ucum:
    # RF028 (#549): one-shot, idempotent UCUM reference-data import — ninth
    # of the 14 Fase 2 sources (Plano Integrado §7.4 step 6, closing out
    # the "LOINC e UCUM" pair right after LOINC). Runs after
    # reference-data-bootstrap-loinc completes, matching the documented
    # recommended order. Idempotent via the run's idempotencyKey lookup;
    # repeat runs are no-ops.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    command: npm run reference:import:ucum
    volumes:
      - ./api/backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env.docker
    depends_on:
      reference-data-bootstrap-loinc:
        condition: service_completed_successfully

  reference-data-bootstrap-dcb:
    # RF028 (#549): one-shot, idempotent DCB reference-data import — tenth
    # of the 14 Fase 2 sources (Plano Integrado §7.4 step 7, "Importar DCB
    # e ATC/DDD", leading the pair right after UCUM closes out step 6).
    # Runs after reference-data-bootstrap-ucum completes, matching the
    # documented recommended order. Idempotent via the run's
    # idempotencyKey lookup; repeat runs are no-ops.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    command: npm run reference:import:dcb
    volumes:
      - ./api/backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env.docker
    depends_on:
      reference-data-bootstrap-ucum:
        condition: service_completed_successfully

  neo4j-projection-worker:
    # Drains graph_projection_outbox into Neo4j (#309, follow-up from RF023/#292)
    # — without this service, outbox rows written by consent.service.js
    # (and future appendLineageEvent/appendQualityEvent/appendTelemetryEvent
    # callers) sit PENDING forever and the graph projection never happens.
    build:
      context: ./api/backend
      dockerfile: Dockerfile.dev
    command: npm run neo4j:canonical:worker
    volumes:
      - ./api/backend:/app
      - backend_node_modules:/app/node_modules
      - ./artifacts:/workspace/artifacts
    env_file:
      - .env.docker
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env.docker
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      WATCHPACK_POLLING: "true"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_data:
  neo4j_data:
  influxdb_data:
  redis_data:
  backend_node_modules:
  frontend_node_modules:

